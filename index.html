<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">

<title>47都道府県ギフトカウンター</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    sans-serif;

  background:#f4f5f8;
}

button,
input{
  font-family:inherit;
}


/* ==============================
   全体
============================== */

.app{
  width:100%;
  height:100dvh;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}


/* ==============================
   ヘッダー
============================== */

.header{
  flex:0 0 auto;

  padding:7px 9px 8px;

  background:
    linear-gradient(
      135deg,
      #ff5968,
      #ff7a45
    );

  color:white;

  box-shadow:
    0 2px 7px rgba(0,0,0,.15);
}


/* タイトル */

.title-row{
  width:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:6px;
}

.title{
  min-width:0;

  font-size:
    clamp(16px,4.3vw,24px);

  font-weight:900;

  line-height:1.15;

  text-align:center;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.edit-title{
  flex:0 0 auto;

  width:27px;
  height:27px;

  border:0;
  border-radius:50%;

  background:
    rgba(255,255,255,.25);

  color:white;

  font-size:14px;

  cursor:pointer;
}


/* ==============================
   ギフト設定
============================== */

.gift-area{
  width:100%;

  display:flex;

  gap:5px;

  margin-top:6px;
}

.gift-input{
  flex:1;

  min-width:0;

  height:31px;

  border:0;

  border-radius:7px;

  padding:0 9px;

  background:white;

  color:#333;

  font-size:13px;

  font-weight:bold;

  outline:none;
}

.save-gift{
  flex:0 0 55px;

  height:31px;

  border:0;

  border-radius:7px;

  background:white;

  color:#ef4b59;

  font-size:12px;

  font-weight:900;

  cursor:pointer;
}


/* ==============================
   ステータス
============================== */

.status{
  flex:0 0 auto;

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:6px;

  padding:5px 8px 4px;

  background:white;
}

.status-box{
  height:39px;

  border-radius:8px;

  background:#f1f2f6;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;
}

.status-label{
  font-size:9px;

  color:#666;

  font-weight:bold;

  line-height:1.1;
}

.status-value{
  margin-top:2px;

  font-size:18px;

  color:#222;

  font-weight:900;

  line-height:1;
}


/* ==============================
   プログレスバー
============================== */

.progress-area{
  flex:0 0 auto;

  padding:2px 9px 5px;

  background:white;
}

.progress-bg{
  width:100%;

  height:8px;

  background:#e5e7eb;

  border-radius:20px;

  overflow:hidden;
}

.progress-bar{
  width:0%;

  height:100%;

  background:
    linear-gradient(
      90deg,
      #ff6973,
      #ff384b
    );

  border-radius:20px;

  transition:width .25s ease;
}


/* ==============================
   都道府県エリア
============================== */

.pref-area{
  flex:1;

  min-height:0;

  padding:4px 6px 6px;

  overflow:hidden;
}


/* ==============================
   3列 × 16行
============================== */

.pref-grid{
  width:100%;
  height:100%;

  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  grid-template-rows:
    repeat(16,minmax(0,1fr));

  gap:3px;
}


/* ==============================
   都道府県カード
============================== */

.pref{
  min-width:0;
  min-height:0;

  border:
    2px solid rgba(0,0,0,.08);

  border-radius:6px;

  display:grid;

  /*
    都道府県名を最大限広くする
  */

  grid-template-columns:
    minmax(0,1fr)
    24px
    40px;

  align-items:center;

  gap:3px;

  padding:
    2px 3px 2px 6px;

  overflow:hidden;

  transition:
    background .2s,
    border .2s,
    box-shadow .2s;
}


/* ==============================
   都道府県名
============================== */

.pref-name{
  min-width:0;

  width:100%;

  display:block;

  /*
    長い都道府県名も
    なるべく大きく表示
  */

  font-size:
    clamp(10px,2.75vw,17px);

  font-weight:900;

  line-height:1;

  color:#222;

  white-space:nowrap;

  /*
    文字を途中で切らない
  */

  overflow:visible;

  text-overflow:clip;

  text-align:left;

  letter-spacing:-.4px;
}


/* ==============================
   都道府県情報
============================== */

.pref-info{
  min-width:0;

  width:100%;

  display:flex;

  align-items:center;

  overflow:visible;
}


/* ==============================
   カウンター
============================== */

.pref-count{
  width:22px;
  height:22px;

  flex:0 0 22px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:white;

  color:#333;

  font-size:10px;

  font-weight:900;

  border:
    1px solid rgba(0,0,0,.08);
}


/* ==============================
   ＋−
============================== */

.pref-buttons{
  width:40px;

  display:flex;

  align-items:center;

  justify-content:flex-end;

  gap:2px;
}

.pref-btn{
  width:19px;
  height:19px;

  flex:0 0 19px;

  border:0;

  border-radius:4px;

  background:white;

  color:#333;

  font-size:12px;

  font-weight:900;

  line-height:19px;

  padding:0;

  display:flex;

  align-items:center;
  justify-content:center;

  cursor:pointer;

  box-shadow:
    0 1px 2px rgba(0,0,0,.08);
}

.pref-btn:active{
  transform:scale(.88);
}


/* ==============================
   地方別カラー
============================== */

.hokkaido{
  background:#d9f1ff;
}

.tohoku{
  background:#d9f3df;
}

.kanto{
  background:#ffe2bd;
}

.hokuriku{
  background:#e6d8ff;
}

.koshin{
  background:#e7ddff;
}

.tokai{
  background:#fff0a8;
}

.kansai{
  background:#ffd9e6;
}

.chugoku{
  background:#d4f1e5;
}

.shikoku{
  background:#d8ecff;
}

.kyushu{
  background:#ffe0c7;
}

.okinawa{
  background:#ccefea;
}


/* ==============================
   ギフト達成済み
============================== */

.pref.active{
  background:
    linear-gradient(
      135deg,
      #ff8b8b,
      #ff3e50
    ) !important;

  border-color:#e52f40;

  box-shadow:
    0 1px 4px
    rgba(255,50,70,.35);
}

.pref.active .pref-name{
  color:white;
}

.pref.active .pref-count{
  background:white;

  color:#ed3447;

  border-color:white;
}


/* ==============================
   モーダル
============================== */

.modal{
  position:fixed;

  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:
    rgba(0,0,0,.5);

  z-index:1000;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(88vw,360px);

  background:white;

  border-radius:15px;

  padding:20px;

  box-shadow:
    0 10px 40px
    rgba(0,0,0,.3);
}

.modal-title{
  font-size:18px;

  font-weight:900;

  text-align:center;

  margin-bottom:12px;
}

.modal-input{
  width:100%;

  height:42px;

  border:2px solid #ddd;

  border-radius:8px;

  padding:0 10px;

  font-size:15px;

  outline:none;
}

.modal-buttons{
  display:flex;

  gap:7px;

  margin-top:12px;
}

.modal-btn{
  flex:1;

  height:40px;

  border:0;

  border-radius:8px;

  font-size:14px;

  font-weight:900;

  cursor:pointer;
}

.cancel{
  background:#eee;

  color:#444;
}

.ok{
  background:#ff5261;

  color:white;
}


/* ==============================
   完成画面
============================== */

.complete-title{
  color:#ff4352;

  font-size:22px;

  font-weight:900;

  text-align:center;
}

.complete-text{
  margin-top:10px;

  text-align:center;

  font-weight:bold;

  line-height:1.6;
}

.complete-gift{
  display:block;

  margin-top:5px;

  color:#ff4352;

  font-size:19px;

  font-weight:900;
}


/* ==============================
   小さいスマホ
============================== */

@media(max-width:360px){

  .pref{

    grid-template-columns:
      minmax(0,1fr)
      22px
      38px;

    padding-left:5px;

    gap:2px;
  }

  .pref-name{
    font-size:10px;

    letter-spacing:-.5px;
  }

  .pref-count{
    width:20px;
    height:20px;

    flex-basis:20px;

    font-size:9px;
  }

  .pref-buttons{
    width:38px;
  }

  .pref-btn{
    width:18px;
    height:18px;

    flex-basis:18px;

    font-size:11px;
  }

}


/* ==============================
   高さが小さいスマホ
============================== */

@media(max-height:700px){

  .header{
    padding-top:5px;
    padding-bottom:6px;
  }

  .gift-area{
    margin-top:4px;
  }

  .status{
    padding-top:4px;
    padding-bottom:3px;
  }

  .status-box{
    height:34px;
  }

  .progress-area{
    padding-bottom:3px;
  }

  .pref-area{
    padding-top:3px;
    padding-bottom:4px;
  }

}

</style>
</head>


<body>

<div class="app">


<!-- =========================================
     ヘッダー
========================================= -->

<header class="header">

  <div class="title-row">

    <div
      class="title"
      id="title">
      47都道府県ギフトカウンター
    </div>

    <button
      class="edit-title"
      onclick="openTitleModal()">
      ✏️
    </button>

  </div>


  <div class="gift-area">

    <input
      type="text"
      id="giftInput"
      class="gift-input"
      value="指定ギフト"
      placeholder="指定ギフト名">

    <button
      class="save-gift"
      onclick="saveGift()">
      保存
    </button>

  </div>

</header>



<!-- =========================================
     ステータス
========================================= -->

<section class="status">

  <div class="status-box">

    <div class="status-label">
      全国ギフト数
    </div>

    <div
      class="status-value"
      id="total">
      0
    </div>

  </div>


  <div class="status-box">

    <div class="status-label">
      達成都道府県
    </div>

    <div class="status-value">

      <span id="completed">0</span>/47

    </div>

  </div>

</section>



<!-- =========================================
     プログレス
========================================= -->

<section class="progress-area">

  <div class="progress-bg">

    <div
      class="progress-bar"
      id="progress">
    </div>

  </div>

</section>



<!-- =========================================
     47都道府県
========================================= -->

<main class="pref-area">

  <div
    class="pref-grid"
    id="prefGrid">
  </div>

</main>

</div>



<!-- =========================================
     タイトル変更
========================================= -->

<div
  class="modal"
  id="titleModal">

  <div class="modal-box">

    <div class="modal-title">
      タイトルを変更
    </div>

    <input
      type="text"
      id="titleInput"
      class="modal-input"
      placeholder="タイトルを入力">

    <div class="modal-buttons">

      <button
        class="modal-btn cancel"
        onclick="closeTitleModal()">
        キャンセル
      </button>

      <button
        class="modal-btn ok"
        onclick="saveTitle()">
        保存
      </button>

    </div>

  </div>

</div>



<!-- =========================================
     全47県達成
========================================= -->

<div
  class="modal"
  id="completeModal">

  <div class="modal-box">

    <div class="complete-title">
      🎉 全47都道府県達成！
    </div>

    <div class="complete-text">

      指定ギフト

      <span
        class="complete-gift"
        id="completeGift">
        指定ギフト
      </span>

      が全都道府県に入りました！

    </div>

    <div class="modal-buttons">

      <button
        class="modal-btn ok"
        onclick="closeCompleteModal()">
        OK
      </button>

    </div>

  </div>

</div>



<script>

/* =========================================
   47都道府県
========================================= */

const prefectures = [

  {name:"北海道",region:"hokkaido"},

  {name:"青森県",region:"tohoku"},
  {name:"岩手県",region:"tohoku"},
  {name:"宮城県",region:"tohoku"},
  {name:"秋田県",region:"tohoku"},
  {name:"山形県",region:"tohoku"},
  {name:"福島県",region:"tohoku"},

  {name:"茨城県",region:"kanto"},
  {name:"栃木県",region:"kanto"},
  {name:"群馬県",region:"kanto"},
  {name:"埼玉県",region:"kanto"},
  {name:"千葉県",region:"kanto"},
  {name:"東京都",region:"kanto"},
  {name:"神奈川県",region:"kanto"},

  {name:"新潟県",region:"hokuriku"},
  {name:"富山県",region:"hokuriku"},
  {name:"石川県",region:"hokuriku"},
  {name:"福井県",region:"hokuriku"},

  {name:"山梨県",region:"koshin"},
  {name:"長野県",region:"koshin"},

  {name:"岐阜県",region:"tokai"},
  {name:"静岡県",region:"tokai"},
  {name:"愛知県",region:"tokai"},
  {name:"三重県",region:"tokai"},

  {name:"滋賀県",region:"kansai"},
  {name:"京都府",region:"kansai"},
  {name:"大阪府",region:"kansai"},
  {name:"兵庫県",region:"kansai"},
  {name:"奈良県",region:"kansai"},
  {name:"和歌山県",region:"kansai"},

  {name:"鳥取県",region:"chugoku"},
  {name:"島根県",region:"chugoku"},
  {name:"岡山県",region:"chugoku"},
  {name:"広島県",region:"chugoku"},
  {name:"山口県",region:"chugoku"},

  {name:"徳島県",region:"shikoku"},
  {name:"香川県",region:"shikoku"},
  {name:"愛媛県",region:"shikoku"},
  {name:"高知県",region:"shikoku"},

  {name:"福岡県",region:"kyushu"},
  {name:"佐賀県",region:"kyushu"},
  {name:"長崎県",region:"kyushu"},
  {name:"熊本県",region:"kyushu"},
  {name:"大分県",region:"kyushu"},
  {name:"宮崎県",region:"kyushu"},
  {name:"鹿児島県",region:"kyushu"},

  {name:"沖縄県",region:"okinawa"}

];


/* =========================================
   カウント
========================================= */

const counts =
  new Array(47).fill(0);

let completedAlready = false;


/* =========================================
   カード作成
========================================= */

function createPrefectures(){

  const grid =
    document.getElementById("prefGrid");

  grid.innerHTML = "";


  prefectures.forEach(
    (pref,index)=>{

      const card =
        document.createElement("div");

      card.className =
        "pref " + pref.region;


      /*
        番号は完全に削除。

        左：都道府県名
        中：カウンター
        右：−＋
      */

      card.innerHTML = `

        <div class="pref-info">

          <span class="pref-name">
            ${pref.name}
          </span>

        </div>


        <span
          class="pref-count"
          id="count-${index}">
          0
        </span>


        <div class="pref-buttons">

          <button
            class="pref-btn"
            onclick="changeCount(${index},-1)">
            −
          </button>

          <button
            class="pref-btn"
            onclick="changeCount(${index},1)">
            ＋
          </button>

        </div>

      `;


      grid.appendChild(card);

    }
  );

}


/* =========================================
   カウント変更
========================================= */

function changeCount(index,value){

  counts[index] += value;


  if(counts[index] < 0){

    counts[index] = 0;

  }


  update();

}


/* =========================================
   更新
========================================= */

function update(){

  let total = 0;

  let completed = 0;


  const cards =
    document.querySelectorAll(".pref");


  counts.forEach(
    (count,index)=>{

      total += count;


      const counter =
        document.getElementById(
          "count-" + index
        );


      if(counter){

        counter.textContent =
          count;

      }


      const card =
        cards[index];


      if(count > 0){

        card.classList.add("active");

        completed++;

      }
      else{

        card.classList.remove("active");

      }

    }
  );


  document.getElementById(
    "total"
  ).textContent = total;


  document.getElementById(
    "completed"
  ).textContent = completed;


  document.getElementById(
    "progress"
  ).style.width =
    ((completed / 47) * 100) + "%";


  if(
    completed === 47 &&
    !completedAlready
  ){

    completedAlready = true;


    document.getElementById(
      "completeGift"
    ).textContent =
      document.getElementById(
        "giftInput"
      ).value.trim() ||
      "指定ギフト";


    document.getElementById(
      "completeModal"
    ).classList.add("show");

  }

}


/* =========================================
   タイトル
========================================= */

function openTitleModal(){

  document.getElementById(
    "titleInput"
  ).value =
    document.getElementById(
      "title"
    ).textContent.trim();


  document.getElementById(
    "titleModal"
  ).classList.add("show");

}


function closeTitleModal(){

  document.getElementById(
    "titleModal"
  ).classList.remove("show");

}


function saveTitle(){

  const value =
    document.getElementById(
      "titleInput"
    ).value.trim();


  if(value){

    document.getElementById(
      "title"
    ).textContent = value;

  }


  closeTitleModal();

}


/* =========================================
   ギフト名
========================================= */

function saveGift(){

  const input =
    document.getElementById(
      "giftInput"
    );


  if(!input.value.trim()){

    input.value =
      "指定ギフト";

  }

}


/* =========================================
   完成モーダル
========================================= */

function closeCompleteModal(){

  document.getElementById(
    "completeModal"
  ).classList.remove("show");

}


/* =========================================
   起動
========================================= */

createPrefectures();

update();

</script>

</body>
</html>
