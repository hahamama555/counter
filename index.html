<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<title>47都道府県 指定ギフトカウンター</title>

<style>

/* =========================
   基本
========================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Noto Sans JP",
  sans-serif;

  background:#f1f1f6;
  color:#222;

  overscroll-behavior:none;
}


/* =========================
   メイン
========================= */

.app{

  width:100%;
  height:100dvh;

  max-width:1080px;
  margin:auto;

  padding:
  max(5px,env(safe-area-inset-top))
  6px
  max(5px,env(safe-area-inset-bottom))
  6px;

  display:flex;
  flex-direction:column;

  gap:5px;

  overflow:hidden;
}


/* =========================
   ヘッダー
========================= */

.header{

  flex:0 0 55px;

  min-height:55px;

  background:
  linear-gradient(
    135deg,
    #6532c6,
    #a64ee8
  );

  color:white;

  border-radius:13px;

  display:flex;
  align-items:center;

  padding:5px 8px;

  position:relative;

  box-shadow:
  0 3px 8px rgba(0,0,0,.12);
}


.header-text{

  width:100%;

  padding-right:42px;

  text-align:center;
}


.title{

  font-size:20px;
  line-height:22px;

  font-weight:900;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}


.subtitle{

  font-size:10px;
  line-height:12px;

  font-weight:700;

  opacity:.9;
}


/* タイトル変更 */

.title-edit{

  position:absolute;

  right:7px;
  top:7px;

  width:38px;
  height:38px;

  border:0;

  border-radius:10px;

  background:rgba(255,255,255,.2);

  color:white;

  font-size:20px;

  font-weight:900;
}


/* =========================
   ギフト
========================= */

.gift-box{

  flex:0 0 38px;

  min-height:38px;

  background:white;

  border-radius:11px;

  display:flex;
  align-items:center;

  padding:4px 6px;

  box-shadow:
  0 2px 7px rgba(0,0,0,.06);
}


.gift-row{

  width:100%;

  display:flex;
  align-items:center;

  gap:5px;
}


.gift-label{

  flex:0 0 auto;

  font-size:13px;

  font-weight:900;

  white-space:nowrap;
}


.gift-input{

  flex:1;

  min-width:0;

  height:30px;

  border:
  2px solid #ddd;

  border-radius:9px;

  padding:
  0 8px;

  font-size:14px;

  font-weight:800;

  outline:none;
}


.save-btn{

  flex:0 0 58px;

  height:30px;

  border:0;

  border-radius:9px;

  background:#6633c7;

  color:white;

  font-size:13px;

  font-weight:900;
}


/* =========================
   ステータス
========================= */

.status{

  flex:0 0 45px;

  min-height:45px;

  display:grid;

  grid-template-columns:
  1fr 1fr;

  gap:5px;
}


.status-card{

  background:white;

  border-radius:11px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:4px;

  white-space:nowrap;

  box-shadow:
  0 2px 7px rgba(0,0,0,.06);
}


.status-label{

  font-size:11px;

  font-weight:900;

  color:#777;
}


.status-number{

  font-size:24px;

  line-height:1;

  font-weight:900;

  color:#6633c7;
}


.status-small{

  font-size:9px;

  font-weight:700;

  color:#777;
}


/* =========================
   進捗
========================= */

.progress-box{

  flex:0 0 38px;

  min-height:38px;

  background:white;

  border-radius:11px;

  padding:
  5px 8px;

  box-shadow:
  0 2px 7px rgba(0,0,0,.06);
}


.progress-top{

  height:12px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  font-size:10px;

  font-weight:900;
}


.progress{

  width:100%;

  height:8px;

  margin-top:3px;

  background:#e1e1e7;

  border-radius:20px;

  overflow:hidden;
}


.progress-bar{

  height:100%;

  width:0%;

  background:
  linear-gradient(
    90deg,
    #6633c7,
    #bd59ef
  );

  transition:.2s;
}


/* =========================
   47都道府県
   4列×12行
========================= */

.prefectures{

  flex:1 1 0;

  min-height:0;

  display:grid;

  grid-template-columns:
  repeat(4,minmax(0,1fr));

  grid-template-rows:
  repeat(12,minmax(0,1fr));

  gap:3px;

  overflow:hidden;
}


/* =========================
   都道府県マス
========================= */

.pref{

  min-width:0;
  min-height:0;

  position:relative;

  background:white;

  border:
  1px solid transparent;

  border-radius:7px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  overflow:hidden;

  box-shadow:
  0 1px 5px rgba(0,0,0,.07);
}


.pref.completed{

  background:#f5edff;

  border-color:#6633c7;
}


/* =========================
   県名
========================= */

.pref-name{

  width:100%;

  text-align:center;

  font-size:12px;

  line-height:14px;

  font-weight:900;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


/* =========================
   カウント
========================= */

.count{

  height:17px;

  line-height:17px;

  font-size:15px;

  font-weight:900;

  color:#6633c7;
}


.count.zero{

  color:#aaa;
}


/* =========================
   ⭕
========================= */

.mark{

  position:absolute;

  right:2px;
  top:1px;

  font-size:10px;

  display:none;
}


.pref.completed .mark{

  display:block;
}


/* =========================
   ボタン
========================= */

.buttons{

  height:18px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:3px;
}


.plus,
.minus{

  width:27px;

  height:18px;

  border:0;

  border-radius:4px;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:13px;

  line-height:18px;

  font-weight:900;

  padding:0;
}


.plus{

  background:#6633c7;

  color:white;
}


.minus{

  background:#e4e4e9;

  color:#555;
}


/* =========================
   タイトル変更モーダル
========================= */

.modal{

  position:fixed;

  inset:0;

  z-index:5000;

  background:
  rgba(0,0,0,.55);

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;
}


.modal.show{

  display:flex;
}


.modal-box{

  width:100%;

  max-width:500px;

  background:white;

  border-radius:18px;

  padding:18px;

  box-shadow:
  0 10px 40px rgba(0,0,0,.3);
}


.modal-title{

  font-size:19px;

  font-weight:900;

  margin-bottom:10px;
}


.title-input{

  width:100%;

  height:45px;

  border:
  2px solid #ddd;

  border-radius:10px;

  padding:
  0 10px;

  font-size:16px;

  font-weight:800;

  outline:none;
}


.modal-buttons{

  display:grid;

  grid-template-columns:
  1fr 1fr;

  gap:7px;

  margin-top:10px;
}


.modal-buttons button{

  height:42px;

  border:0;

  border-radius:10px;

  font-size:15px;

  font-weight:900;
}


.modal-save{

  background:#6633c7;

  color:white;
}


.modal-close{

  background:#e7e7eb;

  color:#333;
}


/* =========================
   コンプリート
========================= */

.complete{

  position:fixed;

  inset:0;

  z-index:6000;

  background:
  rgba(0,0,0,.65);

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;
}


.complete.show{

  display:flex;
}


.complete-card{

  width:90%;

  max-width:500px;

  background:white;

  border-radius:25px;

  padding:30px 15px;

  text-align:center;
}


.complete-icon{

  font-size:55px;
}


.complete-title{

  margin-top:5px;

  font-size:32px;

  font-weight:900;

  color:#6633c7;
}


.complete-text{

  margin-top:6px;

  font-size:16px;

  font-weight:800;
}


.complete-gift{

  margin-top:10px;

  font-size:20px;

  font-weight:900;
}


.complete-close{

  margin-top:18px;

  height:42px;

  padding:0 30px;

  border:0;

  border-radius:10px;

  background:#6633c7;

  color:white;

  font-size:15px;

  font-weight:900;
}


/* =========================
   小型スマホ
========================= */

@media(max-width:380px){

  .app{

    padding:
    max(3px,env(safe-area-inset-top))
    4px
    max(3px,env(safe-area-inset-bottom))
    4px;

    gap:3px;
  }


  .header{

    flex-basis:49px;
    min-height:49px;

    border-radius:10px;
  }


  .title{

    font-size:17px;
    line-height:19px;
  }


  .subtitle{

    font-size:8px;
    line-height:10px;
  }


  .title-edit{

    width:34px;
    height:34px;

    right:5px;
    top:5px;

    font-size:17px;
  }


  .gift-box{

    flex-basis:34px;
    min-height:34px;
  }


  .gift-input,
  .save-btn{

    height:27px;
  }


  .gift-label{

    font-size:11px;
  }


  .gift-input{

    font-size:12px;
  }


  .save-btn{

    flex-basis:50px;

    font-size:11px;
  }


  .status{

    flex-basis:41px;
    min-height:41px;
  }


  .status-label{

    font-size:9px;
  }


  .status-number{

    font-size:21px;
  }


  .status-small{

    font-size:8px;
  }


  .progress-box{

    flex-basis:34px;
    min-height:34px;
  }


  .prefectures{

    gap:2px;
  }


  .pref{

    border-radius:5px;
  }


  .pref-name{

    font-size:10px;
    line-height:12px;
  }


  .count{

    height:15px;

    line-height:15px;

    font-size:13px;
  }


  .buttons{

    height:16px;
  }


  .plus,
  .minus{

    width:24px;
    height:16px;

    font-size:11px;
  }


  .mark{

    font-size:9px;
  }

}

</style>
</head>


<body>


<div class="app">


  <!-- ======================
       ヘッダー
  ======================= -->

  <div class="header">

    <div class="header-text">

      <div
        class="title"
        id="title">
        🇯🇵 47都道府県 指定ギフトカウンター
      </div>

      <div class="subtitle">
        指定ギフトが飛んだ都道府県をカウント！
      </div>

    </div>


    <!-- タイトル変更ボタン -->

    <button
      class="title-edit"
      onclick="openTitleModal()">
      ✏️
    </button>

  </div>


  <!-- ======================
       ギフト
  ======================= -->

  <div class="gift-box">

    <div class="gift-row">

      <div class="gift-label">
        🎁 ギフト
      </div>


      <input
        id="giftInput"
        class="gift-input"
        value="ハートミー"
        maxlength="30">


      <button
        class="save-btn"
        onclick="saveGift()">
        保存
      </button>

    </div>

  </div>


  <!-- ======================
       ステータス
  ======================= -->

  <div class="status">


    <div class="status-card">

      <span class="status-label">
        全国カウント
      </span>

      <span
        class="status-number"
        id="total">
        0
      </span>

      <span
        class="status-small"
        id="giftName1">
        ハートミー
      </span>

    </div>


    <div class="status-card">

      <span class="status-label">
        達成
      </span>

      <span class="status-number">
        <span id="completed">
          0
        </span>

        <span
          style="font-size:11px">
          /47
        </span>
      </span>

      <span class="status-small">
        都道府県
      </span>

    </div>

  </div>


  <!-- ======================
       進捗
  ======================= -->

  <div class="progress-box">

    <div class="progress-top">

      <span>
        🇯🇵 全国制覇
      </span>

      <span id="progressText">
        0 / 47
      </span>

    </div>


    <div class="progress">

      <div
        class="progress-bar"
        id="progressBar">
      </div>

    </div>

  </div>


  <!-- ======================
       47都道府県
  ======================= -->

  <div
    class="prefectures"
    id="prefectures">
  </div>


</div>


<!-- =========================
     タイトル変更
========================= -->

<div
  class="modal"
  id="titleModal">


  <div class="modal-box">

    <div class="modal-title">
      ✏️ タイトルを変更
    </div>


    <input
      id="titleInput"
      class="title-input"
      value="🇯🇵 47都道府県 指定ギフトカウンター"
      maxlength="60">


    <div class="modal-buttons">

      <button
        class="modal-save"
        onclick="saveTitle()">
        保存
      </button>


      <button
        class="modal-close"
        onclick="closeTitleModal()">
        閉じる
      </button>

    </div>

  </div>

</div>


<!-- =========================
     コンプリート
========================= -->

<div
  class="complete"
  id="complete">


  <div class="complete-card">

    <div class="complete-icon">
      🎉🇯🇵🎉
    </div>


    <div class="complete-title">
      全国制覇！
    </div>


    <div class="complete-text">
      47都道府県すべて達成しました！
    </div>


    <div
      class="complete-gift"
      id="completeGift">
      ハートミー
    </div>


    <button
      class="complete-close"
      onclick="closeComplete()">
      閉じる
    </button>

  </div>

</div>


<script>


/* =========================
   47都道府県
========================= */

const prefectureNames = [

  "北海道",

  "青森県",
  "岩手県",
  "宮城県",
  "秋田県",
  "山形県",
  "福島県",

  "茨城県",
  "栃木県",
  "群馬県",
  "埼玉県",
  "千葉県",
  "東京都",
  "神奈川県",

  "新潟県",
  "富山県",
  "石川県",
  "福井県",
  "山梨県",
  "長野県",

  "岐阜県",
  "静岡県",
  "愛知県",
  "三重県",

  "滋賀県",
  "京都府",
  "大阪府",
  "兵庫県",
  "奈良県",
  "和歌山県",

  "鳥取県",
  "島根県",
  "岡山県",
  "広島県",
  "山口県",

  "徳島県",
  "香川県",
  "愛媛県",
  "高知県",

  "福岡県",
  "佐賀県",
  "長崎県",
  "熊本県",
  "大分県",
  "宮崎県",
  "鹿児島県",

  "沖縄県"

];


/* =========================
   データ
========================= */

let counts =
  new Array(47).fill(0);

let giftName =
  "ハートミー";


/* =========================
   都道府県作成
========================= */

function createPrefectures(){

  const container =
    document.getElementById(
      "prefectures"
    );


  container.innerHTML = "";


  prefectureNames.forEach(
    (name,index)=>{


      const pref =
        document.createElement(
          "div"
        );


      pref.className =
        "pref";


      pref.id =
        "pref-" + index;


      pref.innerHTML = `

        <div class="mark">
          ⭕
        </div>


        <div class="pref-name">
          ${name}
        </div>


        <div
          class="count zero"
          id="count-${index}">
          0
        </div>


        <div class="buttons">

          <button
            class="minus"
            onclick="
            changeCount(${index},-1);
            event.stopPropagation();
            ">
            −
          </button>


          <button
            class="plus"
            onclick="
            changeCount(${index},1);
            event.stopPropagation();
            ">
            ＋
          </button>

        </div>

      `;


      container.appendChild(pref);

    }
  );


  /*
    48マスになるので
    最後に空マスを1つ追加
  */

  const empty =
    document.createElement("div");

  empty.style.visibility =
    "hidden";

  container.appendChild(empty);

}


/* =========================
   カウント変更
========================= */

function changeCount(index,value){

  counts[index] += value;


  if(counts[index] < 0){

    counts[index] = 0;

  }


  update();

}


/* =========================
   画面更新
========================= */

function update(){

  let total = 0;

  let completed = 0;


  counts.forEach(
    (num,index)=>{


      total += num;


      const countElement =
        document.getElementById(
          "count-" + index
        );


      const prefElement =
        document.getElementById(
          "pref-" + index
        );


      if(countElement){

        countElement.textContent =
          num;


        countElement.classList.toggle(
          "zero",
          num === 0
        );

      }


      if(prefElement){

        if(num > 0){

          prefElement.classList.add(
            "completed"
          );

          completed++;

        }else{

          prefElement.classList.remove(
            "completed"
          );

        }

      }

    }
  );


  document.getElementById(
    "total"
  ).textContent =
    total;


  document.getElementById(
    "completed"
  ).textContent =
    completed;


  document.getElementById(
    "progressText"
  ).textContent =
    completed + " / 47";


  document.getElementById(
    "progressBar"
  ).style.width =
    (completed / 47 * 100) + "%";


  if(completed === 47){

    showComplete();

  }

}


/* =========================
   ギフト変更
========================= */

function saveGift(){

  const input =
    document.getElementById(
      "giftInput"
    );


  const value =
    input.value.trim();


  if(value){

    giftName =
      value;


    document.getElementById(
      "giftName1"
    ).textContent =
      giftName;

  }

}


/* =========================
   タイトル変更
========================= */

function openTitleModal(){

  const modal =
    document.getElementById(
      "titleModal"
    );


  const input =
    document.getElementById(
      "titleInput"
    );


  input.value =
    document.getElementById(
      "title"
    ).textContent;


  modal.classList.add(
    "show"
  );


  setTimeout(
    ()=>{
      input.focus();
    },
    100
  );

}


function closeTitleModal(){

  document
    .getElementById(
      "titleModal"
    )
    .classList.remove(
      "show"
    );

}


function saveTitle(){

  const input =
    document.getElementById(
      "titleInput"
    );


  const value =
    input.value.trim();


  if(value){

    document.getElementById(
      "title"
    ).textContent =
      value;

  }


  closeTitleModal();

}


/* =========================
   コンプリート
========================= */

function showComplete(){

  document.getElementById(
    "completeGift"
  ).textContent =
    giftName;


  document.getElementById(
    "complete"
  ).classList.add(
    "show"
  );

}


function closeComplete(){

  document.getElementById(
    "complete"
  ).classList.remove(
    "show"
  );

}


/* =========================
   初期化
========================= */

document.getElementById(
  "giftInput"
).value =
  giftName;


createPrefectures();


update();


</script>

</body>
</html>
