<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<title>47都道府県カウンター</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:#f1f2f6;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    sans-serif;
  color:#222;
}


/* =========================
   全体
========================= */

.app{
  width:100%;
  height:100dvh;

  padding:
    max(4px,env(safe-area-inset-top))
    5px
    max(4px,env(safe-area-inset-bottom))
    5px;

  display:flex;
  flex-direction:column;

  gap:4px;

  overflow:hidden;
}


/* =========================
   タイトル
========================= */

.header{
  flex:0 0 48px;

  position:relative;

  background:#333;

  color:#fff;

  border-radius:12px;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;
}

.title{
  max-width:calc(100% - 60px);

  font-size:19px;
  line-height:21px;

  font-weight:900;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.subtitle{
  font-size:8px;
  line-height:10px;

  margin-top:1px;

  opacity:.9;

  font-weight:700;
}

.edit-title{
  position:absolute;

  right:5px;
  top:5px;

  width:36px;
  height:36px;

  border:0;
  border-radius:9px;

  background:#555;

  color:#fff;

  font-size:16px;
}


/* =========================
   ギフト
========================= */

.gift-box{
  flex:0 0 34px;

  background:#fff;

  border-radius:10px;

  display:flex;
  align-items:center;

  padding:3px 6px;
}

.gift-row{
  width:100%;

  display:flex;
  align-items:center;

  gap:5px;
}

.gift-label{
  font-size:10px;
  font-weight:900;
  white-space:nowrap;
}

.gift-input{
  flex:1;
  min-width:0;

  height:27px;

  border:2px solid #ddd;
  border-radius:8px;

  padding:0 7px;

  font-size:12px;
  font-weight:800;

  outline:none;
}

.gift-save{
  width:50px;
  height:27px;

  border:0;
  border-radius:8px;

  background:#333;
  color:#fff;

  font-size:10px;
  font-weight:900;
}


/* =========================
   ステータス
========================= */

.status{
  flex:0 0 38px;

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:4px;
}

.status-card{
  background:#fff;

  border-radius:10px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:3px;
}

.status-label{
  font-size:9px;
  color:#777;
  font-weight:900;
}

.status-number{
  font-size:20px;
  line-height:1;

  color:#e53935;

  font-weight:900;
}

.status-small{
  font-size:7px;
  color:#777;
  font-weight:700;
}


/* =========================
   進捗
========================= */

.progress-box{
  flex:0 0 31px;

  background:#fff;

  border-radius:10px;

  padding:3px 8px;
}

.progress-top{
  height:10px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  font-size:8px;

  font-weight:900;
}

.progress{
  height:7px;

  margin-top:2px;

  background:#e2e2e7;

  border-radius:20px;

  overflow:hidden;
}

.progress-bar{
  width:0%;
  height:100%;

  background:#e53935;

  transition:.2s;
}


/* =========================
   日本地図エリア
========================= */

.map{
  position:relative;

  flex:1;
  min-height:0;

  width:100%;

  overflow:hidden;

  border-radius:12px;

  background:
    radial-gradient(
      circle at center,
      #ffffff 0%,
      #f7f7fa 60%,
      #eeeeF3 100%
    );
}


/* =========================
   県カード
========================= */

.pref{
  position:absolute;

  width:14.1%;
  height:6.9%;

  background:#fff;

  border:1px solid #d9d9df;

  border-radius:6px;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  box-shadow:
    0 1px 3px rgba(0,0,0,.08);

  transition:.15s;

  overflow:hidden;
}

.pref.completed{
  background:#ffd2d2;

  border-color:#e53935;

  box-shadow:
    0 2px 5px rgba(229,57,53,.25);
}

.pref-name{
  width:100%;

  text-align:center;

  font-size:9px;
  line-height:10px;

  font-weight:900;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.count{
  font-size:11px;
  line-height:12px;

  height:12px;

  color:#555;

  font-weight:900;
}

.count.zero{
  color:#aaa;
}

.pref.completed .pref-name,
.pref.completed .count{
  color:#c62828;
}


/* =========================
   ボタン
========================= */

.buttons{
  height:14px;

  display:flex;
  gap:2px;
}

.plus,
.minus{
  width:20px;
  height:14px;

  border:0;
  border-radius:3px;

  padding:0;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:10px;
  line-height:14px;

  font-weight:900;
}

.plus{
  background:#333;
  color:#fff;
}

.pref.completed .plus{
  background:#e53935;
}

.minus{
  background:#e3e3e7;
  color:#555;
}


/* =========================
   番号
========================= */

.pref-number{
  position:absolute;

  left:2px;
  top:2px;

  font-size:6px;

  color:#aaa;

  font-weight:900;
}

.pref.completed .pref-number{
  color:#e53935;
}


/* =========================
   地図っぽい背景ライン
========================= */

.map::before{
  content:"";

  position:absolute;

  left:8%;
  top:8%;

  width:84%;
  height:84%;

  border-radius:48% 42% 50% 45%;

  background:
    linear-gradient(
      120deg,
      transparent 0 48%,
      rgba(210,210,220,.18) 49% 51%,
      transparent 52%
    );

  transform:rotate(-13deg);

  pointer-events:none;
}


/* =========================
   タイトルモーダル
========================= */

.modal{
  position:fixed;

  inset:0;

  z-index:1000;

  display:none;

  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.55);

  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:420px;

  background:#fff;

  border-radius:18px;

  padding:18px;
}

.modal-title{
  font-size:18px;
  font-weight:900;

  margin-bottom:10px;
}

.modal-input{
  width:100%;
  height:44px;

  border:2px solid #ddd;
  border-radius:10px;

  padding:0 10px;

  font-size:15px;
  font-weight:800;

  outline:none;
}

.modal-buttons{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:7px;

  margin-top:10px;
}

.modal-buttons button{
  height:40px;

  border:0;
  border-radius:10px;

  font-size:13px;
  font-weight:900;
}

.modal-save{
  background:#333;
  color:#fff;
}

.modal-close{
  background:#e5e5e9;
}


/* =========================
   完成画面
========================= */

.complete{
  position:fixed;

  inset:0;

  z-index:2000;

  display:none;

  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.65);

  padding:20px;
}

.complete.show{
  display:flex;
}

.complete-card{
  width:90%;

  background:#fff;

  border-radius:24px;

  padding:25px 15px;

  text-align:center;
}

.complete-icon{
  font-size:48px;
}

.complete-title{
  color:#e53935;

  font-size:29px;

  font-weight:900;
}

.complete-text{
  margin-top:4px;

  font-size:15px;

  font-weight:800;
}

.complete-gift{
  margin-top:8px;

  font-size:19px;

  font-weight:900;
}

.complete-close{
  margin-top:16px;

  height:40px;

  padding:0 30px;

  border:0;
  border-radius:10px;

  background:#e53935;

  color:#fff;

  font-size:14px;
  font-weight:900;
}


/* =========================
   小さい画面
========================= */

@media(max-width:380px){

  .header{
    flex-basis:45px;
  }

  .title{
    font-size:16px;
  }

  .subtitle{
    font-size:7px;
  }

  .gift-box{
    flex-basis:32px;
  }

  .status{
    flex-basis:35px;
  }

  .progress-box{
    flex-basis:29px;
  }

  .pref{
    height:6.7%;
  }

  .pref-name{
    font-size:7px;
    line-height:8px;
  }

  .count{
    font-size:10px;
    height:11px;
    line-height:11px;
  }

  .buttons{
    height:12px;
  }

  .plus,
  .minus{
    width:17px;
    height:12px;
    font-size:9px;
    line-height:12px;
  }

}


/* =========================
   極小画面
========================= */

@media(max-width:350px){

  .pref{
    width:14.25%;
  }

  .pref-name{
    font-size:6px;
  }

  .count{
    font-size:9px;
  }

  .plus,
  .minus{
    width:15px;
  }

}

</style>
</head>


<body>

<div class="app">


  <!-- ======================
       タイトル
  ======================= -->

  <div class="header">

    <div>

      <div
        class="title"
        id="title">
        🇯🇵 47都道府県カウンター
      </div>

      <div class="subtitle">
        指定ギフトで都道府県をカウント！
      </div>

    </div>

    <button
      class="edit-title"
      onclick="openTitleModal()">
      ✏️
    </button>

  </div>


  <!-- ======================
       ギフト
  ======================= -->

  <div class="gift-box">

    <div class="gift-row">

      <div class="gift-label">
        🎁 ギフト
      </div>

      <input
        id="giftInput"
        class="gift-input"
        value="ハートミー"
        maxlength="30">

      <button
        class="gift-save"
        onclick="saveGift()">
        保存
      </button>

    </div>

  </div>


  <!-- ======================
       ステータス
  ======================= -->

  <div class="status">

    <div class="status-card">

      <span class="status-label">
        全国
      </span>

      <span
        class="status-number"
        id="total">
        0
      </span>

      <span
        class="status-small"
        id="giftName">
        ハートミー
      </span>

    </div>


    <div class="status-card">

      <span class="status-label">
        達成
      </span>

      <span
        class="status-number"
        id="completed">
        0
      </span>

      <span class="status-small">
        /47県
      </span>

    </div>

  </div>


  <!-- ======================
       進捗
  ======================= -->

  <div class="progress-box">

    <div class="progress-top">

      <span>
        🇯🇵 全国制覇
      </span>

      <span id="progressText">
        0 / 47
      </span>

    </div>

    <div class="progress">

      <div
        class="progress-bar"
        id="progressBar">
      </div>

    </div>

  </div>


  <!-- ======================
       日本地図っぽい47県
  ======================= -->

  <div
    class="map"
    id="map">
  </div>


</div>


<!-- ======================
     タイトル変更
======================= -->

<div
  class="modal"
  id="titleModal">

  <div class="modal-box">

    <div class="modal-title">
      ✏️ タイトルを変更
    </div>

    <input
      id="titleInput"
      class="modal-input"
      value="🇯🇵 47都道府県カウンター"
      maxlength="60">

    <div class="modal-buttons">

      <button
        class="modal-save"
        onclick="saveTitle()">
        保存
      </button>

      <button
        class="modal-close"
        onclick="closeTitleModal()">
        キャンセル
      </button>

    </div>

  </div>

</div>


<!-- ======================
     全国制覇
======================= -->

<div
  class="complete"
  id="complete">

  <div class="complete-card">

    <div class="complete-icon">
      🎉🇯🇵🎉
    </div>

    <div class="complete-title">
      全国制覇！
    </div>

    <div class="complete-text">
      47都道府県すべて達成！
    </div>

    <div
      class="complete-gift"
      id="completeGift">
      ハートミー
    </div>

    <button
      class="complete-close"
      onclick="closeComplete()">
      閉じる
    </button>

  </div>

</div>


<script>

/* ========================================
   47都道府県
======================================== */

const prefectures = [

  "北海道",

  "青森県",
  "岩手県",
  "宮城県",
  "秋田県",
  "山形県",
  "福島県",

  "茨城県",
  "栃木県",
  "群馬県",
  "埼玉県",
  "千葉県",
  "東京都",
  "神奈川県",

  "新潟県",
  "富山県",
  "石川県",
  "福井県",
  "山梨県",
  "長野県",
  "岐阜県",

  "静岡県",
  "愛知県",
  "三重県",

  "滋賀県",
  "京都府",
  "大阪府",
  "兵庫県",
  "奈良県",
  "和歌山県",

  "鳥取県",
  "島根県",
  "岡山県",
  "広島県",
  "山口県",

  "徳島県",
  "香川県",
  "愛媛県",
  "高知県",

  "福岡県",
  "佐賀県",
  "長崎県",
  "熊本県",
  "大分県",
  "宮崎県",
  "鹿児島県",

  "沖縄県"

];


/* ========================================
   日本地図風の配置
   left / top は％
======================================== */

const positions = [

  /* 北海道 */

  [62,3],


  /* 東北 */

  [54,12],
  [66,12],
  [54,19],
  [66,19],
  [54,26],
  [66,26],


  /* 関東 */

  [70,34],
  [78,34],
  [86,34],

  [70,41],
  [78,41],
  [86,41],
  [86,48],


  /* 北陸・甲信 */

  [45,33],
  [53,33],
  [45,40],
  [53,40],
  [45,47],
  [53,47],
  [61,47],


  /* 東海 */

  [61,54],
  [69,54],
  [77,54],
  [69,61],


  /* 関西 */

  [45,54],
  [53,54],
  [45,61],
  [53,61],
  [61,61],
  [45,68],


  /* 中国 */

  [25,55],
  [33,55],
  [25,62],
  [33,62],
  [41,62],


  /* 四国 */

  [39,72],
  [47,72],
  [39,79],
  [47,79],


  /* 九州 */

  [8,70],
  [16,70],
  [8,77],
  [16,77],
  [24,77],
  [8,84],
  [16,84],


  /* 沖縄 */

  [4,91]

];


/* ========================================
   カウント
======================================== */

let counts =
  new Array(47).fill(0);

let giftName =
  "ハートミー";


/* ========================================
   都道府県生成
======================================== */

function createPrefectures(){

  const map =
    document.getElementById("map");

  map.innerHTML = "";


  prefectures.forEach(
    (name,index)=>{

      const pref =
        document.createElement("div");

      pref.className = "pref";

      pref.id =
        "pref-" + index;


      const pos =
        positions[index];


      pref.style.left =
        pos[0] + "%";

      pref.style.top =
        pos[1] + "%";


      pref.innerHTML = `

        <div class="pref-number">
          ${index + 1}
        </div>

        <div
          class="pref-name">
          ${name}
        </div>

        <div
          class="count zero"
          id="count-${index}">
          0
        </div>

        <div class="buttons">

          <button
            class="minus"
            onclick="
              changeCount(${index},-1)
            ">
            −
          </button>

          <button
            class="plus"
            onclick="
              changeCount(${index},1)
            ">
            ＋
          </button>

        </div>

      `;


      map.appendChild(pref);

    }
  );

}


/* ========================================
   カウント変更
======================================== */

function changeCount(index,value){

  counts[index] += value;


  if(counts[index] < 0){

    counts[index] = 0;

  }


  update();

}


/* ========================================
   更新
======================================== */

function update(){

  let total = 0;

  let completed = 0;


  counts.forEach(
    (num,index)=>{

      total += num;


      const count =
        document.getElementById(
          "count-" + index
        );

      const pref =
        document.getElementById(
          "pref-" + index
        );


      if(count){

        count.textContent =
          num;

        count.classList.toggle(
          "zero",
          num === 0
        );

      }


      if(pref){

        if(num > 0){

          pref.classList.add(
            "completed"
          );

          completed++;

        }else{

          pref.classList.remove(
            "completed"
          );

        }

      }

    }
  );


  document.getElementById(
    "total"
  ).textContent =
    total;


  document.getElementById(
    "completed"
  ).textContent =
    completed;


  document.getElementById(
    "progressText"
  ).textContent =
    completed + " / 47";


  document.getElementById(
    "progressBar"
  ).style.width =
    (completed / 47 * 100) + "%";


  if(completed === 47){

    showComplete();

  }

}


/* ========================================
   ギフト名変更
======================================== */

function saveGift(){

  const input =
    document.getElementById(
      "giftInput"
    );

  const value =
    input.value.trim();


  if(value){

    giftName =
      value;


    document.getElementById(
      "giftName"
    ).textContent =
      giftName;

  }

}


/* ========================================
   タイトル変更
======================================== */

function openTitleModal(){

  const modal =
    document.getElementById(
      "titleModal"
    );

  const input =
    document.getElementById(
      "titleInput"
    );


  input.value =
    document.getElementById(
      "title"
    ).textContent;


  modal.classList.add(
    "show"
  );


  setTimeout(
    ()=>{
      input.focus();
    },
    100
  );

}


function closeTitleModal(){

  document
    .getElementById(
      "titleModal"
    )
    .classList.remove(
      "show"
    );

}


function saveTitle(){

  const input =
    document.getElementById(
      "titleInput"
    );

  const value =
    input.value.trim();


  if(value){

    document.getElementById(
      "title"
    ).textContent =
      value;

  }


  closeTitleModal();

}


/* ========================================
   全国制覇
======================================== */

function showComplete(){

  document.getElementById(
    "completeGift"
  ).textContent =
    giftName;


  document.getElementById(
    "complete"
  ).classList.add(
    "show"
  );

}


function closeComplete(){

  document.getElementById(
    "complete"
  ).classList.remove(
    "show"
  );

}


/* ========================================
   初期化
======================================== */

createPrefectures();

update();

</script>

</body>
</html>
