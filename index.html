<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">

<title>47都道府県 指定ギフトカウンター</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  min-height:100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    sans-serif;
  background:#f3f4f8;
  color:#222;
}

body{
  padding:10px;
}

.app{
  width:100%;
  max-width:600px;
  margin:0 auto;
}

/* =========================
   ヘッダー
========================= */

.header{
  background:linear-gradient(135deg,#6a35c7,#9a55e8);
  color:white;
  border-radius:18px;
  padding:14px 12px;
  text-align:center;
  box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.title{
  font-size:24px;
  font-weight:900;
  line-height:1.25;
}

.subtitle{
  font-size:13px;
  margin-top:4px;
  opacity:.9;
}

/* =========================
   ギフト設定
========================= */

.gift-box{
  margin-top:9px;
  background:white;
  border-radius:15px;
  padding:10px;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.gift-row{
  display:flex;
  align-items:center;
  gap:8px;
}

.gift-label{
  font-weight:800;
  white-space:nowrap;
}

.gift-input{
  flex:1;
  min-width:0;
  border:2px solid #ddd;
  border-radius:10px;
  padding:8px 10px;
  font-size:16px;
  font-weight:700;
}

.btn{
  border:none;
  border-radius:10px;
  padding:9px 12px;
  font-weight:800;
  font-size:14px;
  cursor:pointer;
}

.save-btn{
  background:#6a35c7;
  color:white;
}

/* =========================
   ステータス
========================= */

.status{
  margin-top:9px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.status-card{
  background:white;
  border-radius:14px;
  padding:9px;
  text-align:center;
  box-shadow:0 3px 10px rgba(0,0,0,.07);
}

.status-label{
  font-size:12px;
  color:#777;
  font-weight:700;
}

.status-number{
  font-size:27px;
  line-height:1.1;
  font-weight:900;
  color:#6a35c7;
}

.status-small{
  font-size:11px;
  color:#777;
}

/* =========================
   進捗
========================= */

.progress-box{
  margin-top:9px;
  background:white;
  border-radius:14px;
  padding:10px 12px;
  box-shadow:0 3px 10px rgba(0,0,0,.07);
}

.progress-top{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  font-weight:800;
  margin-bottom:6px;
}

.progress{
  height:12px;
  background:#e5e5eb;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#6a35c7,#c45cff);
  transition:.25s;
}

/* =========================
   都道府県
========================= */

.prefectures{
  margin-top:9px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.pref{
  position:relative;
  background:white;
  border-radius:11px;
  min-height:65px;
  padding:6px 4px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  box-shadow:0 2px 7px rgba(0,0,0,.08);
  border:2px solid transparent;
  transition:.15s;
  user-select:none;
}

.pref:active{
  transform:scale(.96);
}

.pref.completed{
  border-color:#6a35c7;
  background:#f5edff;
}

.pref-name{
  font-size:14px;
  font-weight:900;
}

.count{
  font-size:21px;
  font-weight:900;
  color:#6a35c7;
  line-height:1.05;
}

.count.zero{
  color:#aaa;
}

.mark{
  position:absolute;
  top:2px;
  right:5px;
  font-size:18px;
  display:none;
}

.pref.completed .mark{
  display:block;
}

.buttons{
  display:flex;
  gap:4px;
  margin-top:3px;
}

.plus,
.minus{
  width:29px;
  height:24px;
  border:none;
  border-radius:7px;
  font-size:17px;
  font-weight:900;
  line-height:1;
}

.plus{
  background:#6a35c7;
  color:white;
}

.minus{
  background:#e7e7ed;
  color:#555;
}

/* =========================
   下部ボタン
========================= */

.controls{
  margin-top:10px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.control-btn{
  padding:12px 5px;
  border:none;
  border-radius:12px;
  font-size:14px;
  font-weight:900;
}

.title-btn{
  background:#222;
  color:white;
}

.reset-btn{
  background:#e53935;
  color:white;
}

/* =========================
   設定パネル
========================= */

.panel{
  display:none;
  margin-top:9px;
  background:white;
  border-radius:15px;
  padding:12px;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.panel.show{
  display:block;
}

.panel-title{
  font-weight:900;
  margin-bottom:8px;
}

.panel input{
  width:100%;
  border:2px solid #ddd;
  border-radius:10px;
  padding:9px;
  font-size:16px;
}

.panel-buttons{
  display:flex;
  gap:6px;
  margin-top:8px;
}

.panel-buttons button{
  flex:1;
}

/* =========================
   コンプリート
========================= */

.complete{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:999;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.complete.show{
  display:flex;
}

.complete-card{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:25px;
  padding:30px 20px;
  text-align:center;
  animation:pop .35s ease;
}

.complete-icon{
  font-size:65px;
}

.complete-title{
  font-size:30px;
  font-weight:900;
  color:#6a35c7;
}

.complete-text{
  margin-top:8px;
  font-size:17px;
  font-weight:700;
}

.close-complete{
  margin-top:20px;
  border:none;
  border-radius:12px;
  padding:12px 30px;
  background:#6a35c7;
  color:white;
  font-weight:900;
  font-size:16px;
}

@keyframes pop{
  from{
    transform:scale(.6);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

/* =========================
   小さい画面
========================= */

@media(max-width:380px){

  body{
    padding:7px;
  }

  .title{
    font-size:21px;
  }

  .pref{
    min-height:60px;
  }

  .pref-name{
    font-size:13px;
  }

  .count{
    font-size:19px;
  }

  .plus,
  .minus{
    width:26px;
    height:22px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="title" id="title">🇯🇵 47都道府県 指定ギフトカウンター</div>
    <div class="subtitle">
      指定ギフトが飛んだ都道府県をカウント！
    </div>
  </div>

  <div class="gift-box">

    <div class="gift-row">
      <div class="gift-label">🎁 ギフト</div>

      <input
        id="giftInput"
        class="gift-input"
        value="ハートミー"
        maxlength="30"
      >

      <button
        class="btn save-btn"
        onclick="saveGift()">
        保存
      </button>
    </div>

  </div>

  <div class="status">

    <div class="status-card">
      <div class="status-label">全国カウント</div>
      <div class="status-number" id="total">0</div>
      <div class="status-small" id="giftName1">
        ハートミー
      </div>
    </div>

    <div class="status-card">
      <div class="status-label">達成都道府県</div>
      <div class="status-number">
        <span id="completed">0</span>
        <span style="font-size:16px"> / 47</span>
      </div>
      <div class="status-small">
        都道府県コンプリート
      </div>
    </div>

  </div>

  <div class="progress-box">

    <div class="progress-top">
      <span>🇯🇵 全国制覇</span>
      <span id="progressText">0 / 47</span>
    </div>

    <div class="progress">
      <div
        class="progress-bar"
        id="progressBar">
      </div>
    </div>

  </div>

  <div
    class="prefectures"
    id="prefectures">
  </div>

  <div class="controls">

    <button
      class="control-btn title-btn"
      onclick="toggleTitlePanel()">
      ✏️ タイトル変更
    </button>

    <button
      class="control-btn reset-btn"
      onclick="resetAll()">
      🔄 全リセット
    </button>

  </div>

  <div
    class="panel"
    id="titlePanel">

    <div class="panel-title">
      ✏️ タイトルを変更
    </div>

    <input
      id="titleInput"
      value="🇯🇵 47都道府県 指定ギフトカウンター"
      maxlength="50"
    >

    <div class="panel-buttons">

      <button
        class="btn save-btn"
        onclick="saveTitle()">
        保存
      </button>

      <button
        class="btn"
        style="background:#eee"
        onclick="toggleTitlePanel()">
        閉じる
      </button>

    </div>

  </div>

</div>


<!-- コンプリート画面 -->

<div
  class="complete"
  id="complete">

  <div class="complete-card">

    <div class="complete-icon">
      🎉🇯🇵🎉
    </div>

    <div class="complete-title">
      全国制覇！
    </div>

    <div class="complete-text">
      47都道府県すべて達成しました！
    </div>

    <div
      style="margin-top:12px;font-size:22px;font-weight:900"
      id="completeGift">
      ハートミー
    </div>

    <button
      class="close-complete"
      onclick="closeComplete()">
      閉じる
    </button>

  </div>

</div>


<script>

/* ===================================
   47都道府県
=================================== */

const prefectureNames = [

  "北海道",

  "青森県",
  "岩手県",
  "宮城県",
  "秋田県",
  "山形県",
  "福島県",

  "茨城県",
  "栃木県",
  "群馬県",
  "埼玉県",
  "千葉県",
  "東京都",
  "神奈川県",

  "新潟県",
  "富山県",
  "石川県",
  "福井県",
  "山梨県",
  "長野県",

  "岐阜県",
  "静岡県",
  "愛知県",
  "三重県",

  "滋賀県",
  "京都府",
  "大阪府",
  "兵庫県",
  "奈良県",
  "和歌山県",

  "鳥取県",
  "島根県",
  "岡山県",
  "広島県",
  "山口県",

  "徳島県",
  "香川県",
  "愛媛県",
  "高知県",

  "福岡県",
  "佐賀県",
  "長崎県",
  "熊本県",
  "大分県",
  "宮崎県",
  "鹿児島県",

  "沖縄県"

];


/* ===================================
   データ
=================================== */

let counts = new Array(47).fill(0);

let giftName = "ハートミー";


/* ===================================
   画面作成
=================================== */

function createPrefectures(){

  const container =
    document.getElementById("prefectures");

  container.innerHTML = "";

  prefectureNames.forEach((name,index)=>{

    const div =
      document.createElement("div");

    div.className = "pref";

    div.id = "pref-" + index;

    div.innerHTML = `

      <div class="mark">⭕</div>

      <div class="pref-name">
        ${name}
      </div>

      <div
        class="count ${counts[index] === 0 ? "zero" : ""}"
        id="count-${index}">
        ${counts[index]}
      </div>

      <div class="buttons">

        <button
          class="minus"
          onclick="changeCount(${index},-1)">
          −
        </button>

        <button
          class="plus"
          onclick="changeCount(${index},1)">
          ＋
        </button>

      </div>

    `;

    container.appendChild(div);

  });

}


/* ===================================
   カウント変更
=================================== */

function changeCount(index,value){

  counts[index] += value;

  if(counts[index] < 0){
    counts[index] = 0;
  }

  update();

}


/* ===================================
   更新
=================================== */

function update(){

  let total = 0;
  let completed = 0;

  counts.forEach((num,index)=>{

    total += num;

    const countElement =
      document.getElementById("count-" + index);

    const prefElement =
      document.getElementById("pref-" + index);

    if(countElement){

      countElement.textContent = num;

      countElement.classList.toggle(
        "zero",
        num === 0
      );

    }

    if(prefElement){

      if(num > 0){

        prefElement.classList.add(
          "completed"
        );

        completed++;

      }else{

        prefElement.classList.remove(
          "completed"
        );

      }

    }

  });


  document.getElementById("total")
    .textContent = total;

  document.getElementById("completed")
    .textContent = completed;

  document.getElementById("progressText")
    .textContent = completed + " / 47";


  const percent =
    (completed / 47) * 100;

  document.getElementById("progressBar")
    .style.width = percent + "%";


  if(completed === 47){

    showComplete();

  }

}


/* ===================================
   ギフト名保存
=================================== */

function saveGift(){

  const input =
    document.getElementById("giftInput");

  const value =
    input.value.trim();

  if(value){

    giftName = value;

    document.getElementById(
      "giftName1"
    ).textContent = giftName;

  }

}


/* ===================================
   タイトル
=================================== */

function toggleTitlePanel(){

  document
    .getElementById("titlePanel")
    .classList.toggle("show");

}


function saveTitle(){

  const value =
    document
      .getElementById("titleInput")
      .value
      .trim();

  if(value){

    document
      .getElementById("title")
      .textContent = value;

  }

  toggleTitlePanel();

}


/* ===================================
   リセット
=================================== */

function resetAll(){

  const ok =
    confirm(
      "47都道府県のカウントをすべて0にしますか？"
    );

  if(!ok) return;

  counts =
    new Array(47).fill(0);

  update();

}


/* ===================================
   コンプリート
=================================== */

function showComplete(){

  document
    .getElementById("completeGift")
    .textContent = giftName;

  document
    .getElementById("complete")
    .classList.add("show");

}


function closeComplete(){

  document
    .getElementById("complete")
    .classList.remove("show");

}


/* ===================================
   初期化
=================================== */

document
  .getElementById("giftInput")
  .value = giftName;

createPrefectures();

update();

</script>

</body>
</html>
