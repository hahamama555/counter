<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>47都道府県カウンター</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    sans-serif;
  background:#eef2f8;
  color:#222;
}

.app{
  width:100%;
  height:100dvh;
  padding:5px;
  display:flex;
  flex-direction:column;
  gap:5px;
  overflow:hidden;
}

/* =========================
   タイトル
========================= */

.header{
  flex:0 0 58px;
  border-radius:16px;
  background:
    linear-gradient(135deg,#ff4d6d,#ff7043);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  box-shadow:0 3px 10px rgba(0,0,0,.12);
}

.header-inner{
  width:100%;
  text-align:center;
  padding:0 50px;
}

.title{
  font-size:20px;
  font-weight:900;
  line-height:22px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.subtitle{
  font-size:9px;
  font-weight:700;
  margin-top:2px;
}

.edit-title{
  position:absolute;
  right:7px;
  top:7px;
  width:42px;
  height:42px;
  border:0;
  border-radius:12px;
  background:rgba(255,255,255,.22);
  color:white;
  font-size:20px;
}

/* =========================
   ギフト
========================= */

.gift-box{
  flex:0 0 40px;
  background:white;
  border-radius:13px;
  padding:4px 6px;
  box-shadow:0 2px 7px rgba(0,0,0,.06);
}

.gift-row{
  height:100%;
  display:flex;
  align-items:center;
  gap:6px;
}

.gift-label{
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
}

.gift-input{
  flex:1;
  min-width:0;
  height:31px;
  border:2px solid #ddd;
  border-radius:10px;
  padding:0 9px;
  font-size:13px;
  font-weight:800;
  outline:none;
}

.gift-input:focus{
  border-color:#ff5367;
}

.gift-save{
  width:57px;
  height:31px;
  border:0;
  border-radius:10px;
  background:#ff5367;
  color:white;
  font-size:12px;
  font-weight:900;
}

/* =========================
   全国カウント
========================= */

.status{
  flex:0 0 43px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
}

.status-card{
  background:white;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  box-shadow:0 2px 7px rgba(0,0,0,.06);
}

.status-label{
  color:#777;
  font-size:10px;
  font-weight:900;
}

.status-number{
  color:#f13c4e;
  font-size:23px;
  line-height:1;
  font-weight:900;
}

.status-small{
  color:#777;
  font-size:8px;
  font-weight:700;
}

/* =========================
   全国制覇
========================= */

.progress-box{
  flex:0 0 39px;
  background:white;
  border-radius:13px;
  padding:5px 9px;
  box-shadow:0 2px 7px rgba(0,0,0,.06);
}

.progress-top{
  height:11px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:9px;
  font-weight:900;
}

.progress{
  height:8px;
  margin-top:4px;
  background:#e3e6ed;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  width:0%;
  height:100%;
  border-radius:20px;
  background:
    linear-gradient(
      90deg,
      #ff4058,
      #ff8848,
      #ffc247
    );
  transition:.25s;
}

/* =========================
   日本地図エリア
========================= */

.map{
  flex:1;
  min-height:0;
  overflow:hidden;

  border-radius:18px;

  background:
    radial-gradient(
      ellipse at center,
      #ffffff 0%,
      #f7f9fd 60%,
      #e9eef6 100%
    );

  padding:5px;

  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.04);
}

/*
  実際の日本地図に近い配置用グリッド

  12列 × 12行

  北海道
      ↓
  東北
      ↓
  関東・中部
      ↓
  関西・中国・四国
      ↓
  九州
      ↓
  沖縄
*/

.map-grid{
  width:100%;
  height:100%;

  display:grid;

  grid-template-columns:
    repeat(12,minmax(0,1fr));

  grid-template-rows:
    repeat(12,minmax(0,1fr));

  gap:3px;
}

/* =========================
   県カード
========================= */

.pref{
  min-width:0;
  min-height:0;

  border-radius:8px;

  border:2px solid rgba(255,255,255,.9);

  position:relative;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  overflow:hidden;

  box-shadow:
    0 2px 4px rgba(30,50,80,.12);

  transition:.15s;
}

.pref:active{
  transform:scale(.94);
}

/* 地方カラー */

.hokkaido{
  background:#bfe9ff;
}

.tohoku{
  background:#bff0cf;
}

.kanto{
  background:#ffd3ad;
}

.hokuriku{
  background:#d7ccff;
}

.chubu{
  background:#fff0a8;
}

.kansai{
  background:#ffc6dc;
}

.chugoku{
  background:#bceee4;
}

.shikoku{
  background:#c9dcff;
}

.kyushu{
  background:#ffd0b0;
}

.okinawa{
  background:#b9eee8;
}

/* 1以上 */

.pref.active{
  background:
    linear-gradient(
      135deg,
      #ff7777,
      #ff3f4f
    ) !important;

  border-color:#e62b3c;

  box-shadow:
    0 3px 8px rgba(230,43,60,.3);
}

.pref.active .name,
.pref.active .count{
  color:#8e101c;
}

/* 番号 */

.number{
  position:absolute;
  top:2px;
  left:3px;

  min-width:14px;
  height:13px;

  padding:0 2px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:4px;

  background:rgba(255,255,255,.65);

  font-size:6px;
  font-weight:900;
  color:#596170;
}

.active .number{
  background:#d82939;
  color:white;
}

/* 県名 */

.name{
  width:100%;

  padding:0 2px;

  text-align:center;

  color:#273243;

  font-size:8px;
  line-height:9px;

  font-weight:900;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* カウント */

.count{
  height:12px;

  color:#424a57;

  font-size:11px;
  line-height:12px;

  font-weight:900;
}

.count.zero{
  color:#9299a3;
}

/* ボタン */

.buttons{
  height:15px;

  display:flex;
  align-items:center;
  gap:2px;
}

.buttons button{
  width:20px;
  height:15px;

  border:0;
  border-radius:4px;

  font-size:11px;
  line-height:15px;

  font-weight:900;
}

.minus{
  background:rgba(255,255,255,.75);
  color:#555;
}

.plus{
  background:#5140c8;
  color:white;
}

.active .plus{
  background:#d52b3c;
}

/* =========================
   タイトル変更モーダル
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:1000;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(20,25,40,.6);
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:420px;

  background:white;

  border-radius:20px;

  padding:18px;
}

.modal-title{
  font-size:18px;
  font-weight:900;
  margin-bottom:10px;
}

.modal-input{
  width:100%;
  height:45px;

  border:2px solid #ddd;
  border-radius:10px;

  padding:0 10px;

  font-size:16px;
  font-weight:800;

  outline:none;
}

.modal-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:10px;
}

.modal-buttons button{
  height:42px;
  border:0;
  border-radius:10px;
  font-size:14px;
  font-weight:900;
}

.modal-save{
  background:#ff5367;
  color:white;
}

.modal-close{
  background:#e7e8ed;
  color:#333;
}

/* =========================
   全国制覇
========================= */

.complete{
  position:fixed;
  inset:0;
  z-index:2000;

  display:none;

  align-items:center;
  justify-content:center;

  background:rgba(20,20,30,.65);
}

.complete.show{
  display:flex;
}

.complete-card{
  width:90%;
  max-width:400px;

  background:white;

  border-radius:25px;

  padding:25px 15px;

  text-align:center;
}

.complete-icon{
  font-size:48px;
}

.complete-title{
  color:#e52d3e;
  font-size:29px;
  font-weight:900;
}

.complete-text{
  margin-top:5px;
  font-size:14px;
  font-weight:800;
}

.complete-gift{
  margin-top:8px;
  font-size:19px;
  font-weight:900;
}

.complete-close{
  margin-top:16px;

  height:42px;

  padding:0 30px;

  border:0;
  border-radius:10px;

  background:#e52d3e;

  color:white;

  font-size:14px;
  font-weight:900;
}

/* =========================
   小さいスマホ
========================= */

@media(max-width:380px){

  .header{
    flex-basis:51px;
  }

  .title{
    font-size:17px;
    line-height:19px;
  }

  .subtitle{
    font-size:8px;
  }

  .edit-title{
    width:37px;
    height:37px;
    font-size:17px;
  }

  .gift-box{
    flex-basis:35px;
  }

  .gift-input,
  .gift-save{
    height:27px;
  }

  .gift-label{
    font-size:10px;
  }

  .gift-input{
    font-size:11px;
  }

  .gift-save{
    width:49px;
    font-size:10px;
  }

  .status{
    flex-basis:38px;
  }

  .status-label{
    font-size:8px;
  }

  .status-number{
    font-size:20px;
  }

  .progress-box{
    flex-basis:34px;
  }

  .map{
    padding:3px;
  }

  .map-grid{
    gap:2px;
  }

  .pref{
    border-radius:6px;
  }

  .number{
    min-width:11px;
    height:11px;
    font-size:5px;
  }

  .name{
    font-size:6.5px;
    line-height:7px;
  }

  .count{
    font-size:9px;
    height:10px;
    line-height:10px;
  }

  .buttons{
    height:12px;
  }

  .buttons button{
    width:17px;
    height:12px;
    font-size:8px;
    line-height:12px;
  }
}

</style>
</head>

<body>

<div class="app">

  <!-- タイトル -->

  <div class="header">

    <div class="header-inner">

      <div id="title" class="title">
        🇯🇵 47都道府県カウンター
      </div>

      <div class="subtitle">
        指定ギフトで都道府県をカウント！
      </div>

    </div>

    <button
      class="edit-title"
      onclick="openTitleModal()">
      ✏️
    </button>

  </div>


  <!-- ギフト -->

  <div class="gift-box">

    <div class="gift-row">

      <div class="gift-label">
        🎁 ギフト
      </div>

      <input
        id="giftInput"
        class="gift-input"
        value="ハートミー"
        maxlength="30">

      <button
        class="gift-save"
        onclick="saveGift()">
        保存
      </button>

    </div>

  </div>


  <!-- ステータス -->

  <div class="status">

    <div class="status-card">

      <span class="status-label">
        全国
      </span>

      <span
        id="total"
        class="status-number">
        0
      </span>

      <span
        id="giftName"
        class="status-small">
        ハートミー
      </span>

    </div>

    <div class="status-card">

      <span class="status-label">
        達成
      </span>

      <span
        id="completed"
        class="status-number">
        0
      </span>

      <span class="status-small">
        /47県
      </span>

    </div>

  </div>


  <!-- 全国制覇 -->

  <div class="progress-box">

    <div class="progress-top">

      <span>
        🇯🇵 全国制覇
      </span>

      <span id="progressText">
        0 / 47
      </span>

    </div>

    <div class="progress">

      <div
        id="progressBar"
        class="progress-bar">
      </div>

    </div>

  </div>


  <!-- =========================
       日本地図
  ========================== -->

  <div class="map">

    <div
      id="mapGrid"
      class="map-grid">
    </div>

  </div>

</div>


<!-- タイトル変更 -->

<div
  id="titleModal"
  class="modal">

  <div class="modal-box">

    <div class="modal-title">
      ✏️ タイトルを変更
    </div>

    <input
      id="titleInput"
      class="modal-input"
      value="🇯🇵 47都道府県カウンター"
      maxlength="60">

    <div class="modal-buttons">

      <button
        class="modal-save"
        onclick="saveTitle()">
        保存
      </button>

      <button
        class="modal-close"
        onclick="closeTitleModal()">
        キャンセル
      </button>

    </div>

  </div>

</div>


<!-- 全国制覇 -->

<div
  id="complete"
  class="complete">

  <div class="complete-card">

    <div class="complete-icon">
      🎉🇯🇵🎉
    </div>

    <div class="complete-title">
      全国制覇！
    </div>

    <div class="complete-text">
      47都道府県すべて達成！
    </div>

    <div
      id="completeGift"
      class="complete-gift">
      ハートミー
    </div>

    <button
      class="complete-close"
      onclick="closeComplete()">
      閉じる
    </button>

  </div>

</div>


<script>

/* ==================================================
   47都道府県

   row / col は日本地図に近い位置関係

   12列 × 12行
================================================== */

const prefectures = [

  /* ======================
     北海道
  ====================== */

  ["北海道","hokkaido",1,7],


  /* ======================
     東北
  ====================== */

  ["青森県","tohoku",2,6],
  ["秋田県","tohoku",3,5],
  ["岩手県","tohoku",3,7],

  ["山形県","tohoku",4,5],
  ["宮城県","tohoku",4,7],

  ["福島県","tohoku",5,7],


  /* ======================
     北陸
  ====================== */

  ["新潟県","hokuriku",4,3],
  ["富山県","hokuriku",5,3],
  ["石川県","hokuriku",5,2],
  ["福井県","hokuriku",6,2],


  /* ======================
     関東
  ====================== */

  ["群馬県","kanto",5,8],
  ["栃木県","kanto",5,9],
  ["茨城県","kanto",6,10],

  ["埼玉県","kanto",6,9],
  ["東京都","kanto",7,9],

  ["千葉県","kanto",7,10],
  ["神奈川県","kanto",8,9],


  /* ======================
     甲信
  ====================== */

  ["長野県","chubu",6,5],
  ["山梨県","chubu",7,7],


  /* ======================
     東海
  ====================== */

  ["岐阜県","chubu",6,6],
  ["静岡県","chubu",7,8],
  ["愛知県","chubu",8,7],
  ["三重県","chubu",8,6],


  /* ======================
     関西
  ====================== */

  ["滋賀県","kansai",7,5],
  ["京都府","kansai",7,4],

  ["兵庫県","kansai",7,3],
  ["大阪府","kansai",8,4],

  ["奈良県","kansai",8,5],
  ["和歌山県","kansai",9,4],


  /* ======================
     中国
  ====================== */

  ["鳥取県","chugoku",7,1],
  ["島根県","chugoku",7,2],

  ["岡山県","chugoku",8,2],
  ["広島県","chugoku",8,1],

  ["山口県","chugoku",9,1],


  /* ======================
     四国
  ====================== */

  ["香川県","shikoku",9,6],
  ["徳島県","shikoku",9,7],

  ["愛媛県","shikoku",10,5],
  ["高知県","shikoku",10,6],


  /* ======================
     九州
  ====================== */

  ["福岡県","kyushu",9,2],
  ["佐賀県","kyushu",10,2],

  ["長崎県","kyushu",10,1],
  ["熊本県","kyushu",11,2],

  ["大分県","kyushu",10,3],
  ["宮崎県","kyushu",11,4],

  ["鹿児島県","kyushu",12,3],


  /* ======================
     沖縄
  ====================== */

  ["沖縄県","okinawa",12,1]

];


/* ==================================================
   カウント
================================================== */

const counts =
  new Array(47).fill(0);

let giftName =
  "ハートミー";


/* ==================================================
   マップ生成
================================================== */

function createMap(){

  const grid =
    document.getElementById("mapGrid");

  grid.innerHTML="";


  prefectures.forEach(
    (pref,index)=>{

      const [
        name,
        region,
        row,
        col
      ] = pref;


      const card =
        document.createElement("div");

      card.className =
        "pref " + region;

      card.style.gridRow =
        row;

      card.style.gridColumn =
        col;

      card.id =
        "pref-"+index;


      card.innerHTML = `

        <div class="number">
          ${index+1}
        </div>

        <div class="name">
          ${name}
        </div>

        <div
          id="count-${index}"
          class="count zero">
          0
        </div>

        <div class="buttons">

          <button
            class="minus"
            onclick="changeCount(${index},-1)">
            −
          </button>

          <button
            class="plus"
            onclick="changeCount(${index},1)">
            ＋
          </button>

        </div>

      `;


      grid.appendChild(card);

    }
  );

}


/* ==================================================
   カウント変更
================================================== */

function changeCount(index,value){

  counts[index] += value;

  if(counts[index] < 0){
    counts[index]=0;
  }

  update();

}


/* ==================================================
   更新
================================================== */

function update(){

  let total=0;
  let completed=0;


  counts.forEach(
    (num,index)=>{

      total += num;


      const count =
        document.getElementById(
          "count-"+index
        );

      const card =
        document.getElementById(
          "pref-"+index
        );


      count.textContent=num;


      count.classList.toggle(
        "zero",
        num===0
      );


      /*
        1以上なら赤色
      */

      if(num>0){

        card.classList.add("active");

        completed++;

      }else{

        card.classList.remove("active");

      }

    }
  );


  document.getElementById(
    "total"
  ).textContent=total;


  document.getElementById(
    "completed"
  ).textContent=completed;


  document.getElementById(
    "progressText"
  ).textContent=
    completed+" / 47";


  document.getElementById(
    "progressBar"
  ).style.width=
    (completed/47*100)+"%";


  if(completed===47){

    showComplete();

  }

}


/* ==================================================
   ギフト名変更
================================================== */

function saveGift(){

  const input =
    document.getElementById(
      "giftInput"
    );

  const value =
    input.value.trim();


  if(!value){
    return;
  }


  giftName=value;


  document.getElementById(
    "giftName"
  ).textContent=
    giftName;

}


/* ==================================================
   タイトル変更
================================================== */

function openTitleModal(){

  const modal =
    document.getElementById(
      "titleModal"
    );

  const input =
    document.getElementById(
      "titleInput"
    );


  input.value =
    document.getElementById(
      "title"
    ).textContent;


  modal.classList.add("show");


  setTimeout(
    ()=>{
      input.focus();
      input.select();
    },
    100
  );

}


function closeTitleModal(){

  document
    .getElementById(
      "titleModal"
    )
    .classList.remove("show");

}


function saveTitle(){

  const input =
    document.getElementById(
      "titleInput"
    );

  const value =
    input.value.trim();


  if(value){

    document.getElementById(
      "title"
    ).textContent=
      value;

  }


  closeTitleModal();

}


/* ==================================================
   全国制覇
================================================== */

function showComplete(){

  document.getElementById(
    "completeGift"
  ).textContent=
    giftName;


  document.getElementById(
    "complete"
  ).classList.add("show");

}


function closeComplete(){
