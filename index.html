<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>47都道府県 指定ギフトカウンター</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    sans-serif;
  background:#f2f2f7;
  color:#222;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

/* =========================
   9:16メイン画面
========================= */

.app{
  width:100vw;
  height:100vh;
  max-width:1080px;
  max-height:1920px;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:10px;
  overflow:hidden;
}

/* =========================
   タイトル
========================= */

.header{
  flex:0 0 92px;
  background:linear-gradient(135deg,#6633c7,#a451e8);
  border-radius:22px;
  color:#fff;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.title{
  font-size:34px;
  font-weight:900;
  line-height:1.15;
}

.subtitle{
  font-size:18px;
  font-weight:700;
  margin-top:5px;
}

/* =========================
   ギフト
========================= */

.gift-box{
  flex:0 0 62px;
  background:#fff;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px 14px;
  box-shadow:0 3px 10px rgba(0,0,0,.07);
}

.gift-row{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
}

.gift-label{
  font-size:20px;
  font-weight:900;
  white-space:nowrap;
}

.gift-input{
  flex:1;
  min-width:0;
  height:44px;
  border:2px solid #ddd;
  border-radius:10px;
  padding:0 12px;
  font-size:19px;
  font-weight:800;
}

.save-btn{
  height:44px;
  padding:0 18px;
  border:0;
  border-radius:10px;
  background:#6633c7;
  color:white;
  font-size:17px;
  font-weight:900;
}

/* =========================
   ステータス
========================= */

.status{
  flex:0 0 80px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.status-card{
  background:#fff;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  box-shadow:0 3px 10px rgba(0,0,0,.07);
}

.status-label{
  font-size:16px;
  font-weight:800;
  color:#777;
}

.status-number{
  font-size:31px;
  font-weight:900;
  color:#6633c7;
}

.status-small{
  font-size:13px;
  color:#777;
  font-weight:700;
}

/* =========================
   進捗
========================= */

.progress-box{
  flex:0 0 60px;
  background:#fff;
  border-radius:16px;
  padding:9px 15px;
  box-shadow:0 3px 10px rgba(0,0,0,.07);
}

.progress-top{
  height:21px;
  display:flex;
  justify-content:space-between;
  font-size:16px;
  font-weight:900;
}

.progress{
  height:14px;
  background:#e5e5eb;
  border-radius:20px;
  overflow:hidden;
  margin-top:5px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#6633c7,#c65cff);
  transition:.25s;
}

/* =========================
   47都道府県
========================= */

.prefectures{
  flex:1 1 auto;
  min-height:0;

  display:grid;

  /*
    47県
    3列 × 16行
  */
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(16,minmax(0,1fr));

  gap:6px;

  overflow:hidden;
}

.pref{
  position:relative;

  background:#fff;
  border:2px solid transparent;
  border-radius:10px;

  min-width:0;
  min-height:0;

  display:grid;

  /*
    県名
    カウント
    ボタン
  */
  grid-template-columns:1fr;
  grid-template-rows:1fr 1fr 28px;

  align-items:center;
  justify-items:center;

  box-shadow:0 2px 7px rgba(0,0,0,.07);

  user-select:none;
}

.pref.completed{
  border-color:#6633c7;
  background:#f6efff;
}

.pref-name{
  font-size:17px;
  font-weight:900;
  line-height:1;
  white-space:nowrap;
}

.count{
  font-size:23px;
  line-height:1;
  font-weight:900;
  color:#6633c7;
}

.count.zero{
  color:#aaa;
}

.mark{
  position:absolute;
  right:5px;
  top:3px;
  font-size:18px;
  display:none;
}

.pref.completed .mark{
  display:block;
}

.buttons{
  display:flex;
  gap:4px;
  height:25px;
}

.plus,
.minus{
  width:38px;
  height:25px;
  border:0;
  border-radius:6px;
  font-size:17px;
  font-weight:900;
  line-height:1;
}

.plus{
  background:#6633c7;
  color:white;
}

.minus{
  background:#e7e7ed;
  color:#555;
}

/* =========================
   下部操作
========================= */

.controls{
  flex:0 0 55px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.control-btn{
  border:0;
  border-radius:13px;
  font-size:17px;
  font-weight:900;
}

.title-btn{
  background:#222;
  color:white;
}

.reset-btn{
  background:#e53935;
  color:white;
}

/* =========================
   タイトル設定
========================= */

.panel{
  display:none;
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:90%;
  max-width:600px;
  background:white;
  border-radius:20px;
  padding:20px;
  z-index:1000;
  box-shadow:0 10px 40px rgba(0,0,0,.3);
}

.panel.show{
  display:block;
}

.panel-title{
  font-size:21px;
  font-weight:900;
  margin-bottom:10px;
}

.panel input{
  width:100%;
  height:48px;
  border:2px solid #ddd;
  border-radius:10px;
  padding:0 12px;
  font-size:18px;
}

.panel-buttons{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.panel-buttons button{
  flex:1;
  height:45px;
  border:0;
  border-radius:10px;
  font-weight:900;
}

/* =========================
   コンプリート
========================= */

.complete{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.68);
  z-index:2000;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.complete.show{
  display:flex;
}

.complete-card{
  width:90%;
  max-width:600px;
  background:#fff;
  border-radius:28px;
  padding:35px 20px;
  text-align:center;
  animation:pop .3s ease;
}

.complete-icon{
  font-size:65px;
}

.complete-title{
  font-size:38px;
  font-weight:900;
  color:#6633c7;
}

.complete-text{
  margin-top:8px;
  font-size:20px;
  font-weight:800;
}

.complete-gift{
  margin-top:12px;
  font-size:25px;
  font-weight:900;
}

.close-complete{
  margin-top:20px;
  padding:13px 35px;
  border:0;
  border-radius:12px;
  background:#6633c7;
  color:#fff;
  font-size:18px;
  font-weight:900;
}

@keyframes pop{
  from{
    transform:scale(.65);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}


/* =========================
   縦長スマホ
========================= */

@media(max-width:600px){

  .app{
    padding:7px;
    gap:5px;
  }

  .header{
    flex-basis:58px;
    border-radius:13px;
  }

  .title{
    font-size:20px;
  }

  .subtitle{
    font-size:11px;
    margin-top:2px;
  }

  .gift-box{
    flex-basis:39px;
    border-radius:10px;
    padding:4px 6px;
  }

  .gift-row{
    gap:5px;
  }

  .gift-label{
    font-size:12px;
  }

  .gift-input{
    height:30px;
    font-size:13px;
    padding:0 7px;
  }

  .save-btn{
    height:30px;
    padding:0 9px;
    font-size:12px;
  }

  .status{
    flex-basis:48px;
    gap:5px;
  }

  .status-card{
    border-radius:10px;
    gap:4px;
  }

  .status-label{
    font-size:10px;
  }

  .status-number{
    font-size:20px;
  }

  .status-small{
    font-size:8px;
  }

  .progress-box{
    flex-basis:39px;
    border-radius:10px;
    padding:5px 8px;
  }

  .progress-top{
    height:12px;
    font-size:10px;
  }

  .progress{
    height:8px;
    margin-top:3px;
  }

  .prefectures{
    gap:3px;
  }

  .pref{
    border-radius:6px;
    border-width:1px;

    grid-template-rows:
      1fr
      1fr
      18px;
  }

  .pref-name{
    font-size:10px;
  }

  .count{
    font-size:14px;
  }

  .mark{
    right:2px;
    top:0;
    font-size:11px;
  }

  .buttons{
    height:17px;
    gap:2px;
  }

  .plus,
  .minus{
    width:25px;
    height:17px;
    border-radius:4px;
    font-size:12px;
  }

  .controls{
    flex-basis:36px;
    gap:4px;
  }

  .control-btn{
    border-radius:8px;
    font-size:11px;
  }

}


/* =========================
   極小画面
========================= */

@media(max-width:380px){

  .app{
    padding:5px;
    gap:3px;
  }

  .header{
    flex-basis:50px;
  }

  .title{
    font-size:17px;
  }

  .subtitle{
    font-size:9px;
  }

  .gift-box{
    flex-basis:34px;
  }

  .status{
    flex-basis:43px;
  }

  .progress-box{
    flex-basis:35px;
  }

  .pref-name{
    font-size:9px;
  }

  .count{
    font-size:12px;
  }

  .plus,
  .minus{
    width:22px;
    height:15px;
    font-size:11px;
  }

  .controls{
    flex-basis:32px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- タイトル -->
  <div class="header">

    <div
      class="title"
      id="title">
      🇯🇵 47都道府県 指定ギフトカウンター
    </div>

    <div class="subtitle">
      指定ギフトが飛んだ都道府県をカウント！
    </div>

  </div>


  <!-- ギフト -->
  <div class="gift-box">

    <div class="gift-row">

      <div class="gift-label">
        🎁 ギフト
      </div>

      <input
        id="giftInput"
        class="gift-input"
        value="ハートミー"
        maxlength="30"
      >

      <button
        class="save-btn"
        onclick="saveGift()">
        保存
      </button>

    </div>

  </div>


  <!-- ステータス -->
  <div class="status">

    <div class="status-card">

      <div class="status-label">
        全国カウント
      </div>

      <div
        class="status-number"
        id="total">
        0
      </div>

      <div
        class="status-small"
        id="giftName1">
        ハートミー
      </div>

    </div>


    <div class="status-card">

      <div class="status-label">
        達成
      </div>

      <div class="status-number">

        <span id="completed">
          0
        </span>

        <span style="font-size:12px">
          /47
        </span>

      </div>

      <div class="status-small">
        都道府県
      </div>

    </div>

  </div>


  <!-- 進捗 -->
  <div class="progress-box">

    <div class="progress-top">

      <span>
        🇯🇵 全国制覇
      </span>

      <span id="progressText">
        0 / 47
      </span>

    </div>

    <div class="progress">

      <div
        class="progress-bar"
        id="progressBar">
      </div>

    </div>

  </div>


  <!-- 47都道府県 -->
  <div
    class="prefectures"
    id="prefectures">
  </div>


  <!-- 操作 -->
  <div class="controls">

    <button
      class="control-btn title-btn"
      onclick="toggleTitlePanel()">
      ✏️ タイトル変更
    </button>

    <button
      class="control-btn reset-btn"
      onclick="resetAll()">
      🔄 全リセット
    </button>

  </div>


  <!-- タイトル変更パネル -->
  <div
    class="panel"
    id="titlePanel">

    <div class="panel-title">
      ✏️ タイトルを変更
    </div>

    <input
      id="titleInput"
      value="🇯🇵 47都道府県 指定ギフトカウンター"
      maxlength="50"
    >

    <div class="panel-buttons">

      <button
        style="background:#6633c7;color:white"
        onclick="saveTitle()">
        保存
      </button>

      <button
        style="background:#eee"
        onclick="toggleTitlePanel()">
        閉じる
      </button>

    </div>

  </div>

</div>


<!-- コンプリート -->
<div
  class="complete"
  id="complete">

  <div class="complete-card">

    <div class="complete-icon">
      🎉🇯🇵🎉
    </div>

    <div class="complete-title">
      全国制覇！
    </div>

    <div class="complete-text">
      47都道府県すべて達成しました！
    </div>

    <div
      class="complete-gift"
      id="completeGift">
      ハートミー
    </div>

    <button
      class="close-complete"
      onclick="closeComplete()">
      閉じる
    </button>

  </div>

</div>


<script>

/* =========================
   47都道府県
========================= */

const prefectureNames = [

  "北海道",

  "青森県",
  "岩手県",
  "宮城県",
  "秋田県",
  "山形県",
  "福島県",

  "茨城県",
  "栃木県",
  "群馬県",
  "埼玉県",
  "千葉県",
  "東京都",
  "神奈川県",

  "新潟県",
  "富山県",
  "石川県",
  "福井県",
  "山梨県",
  "長野県",

  "岐阜県",
  "静岡県",
  "愛知県",
  "三重県",

  "滋賀県",
  "京都府",
  "大阪府",
  "兵庫県",
  "奈良県",
  "和歌山県",

  "鳥取県",
  "島根県",
  "岡山県",
  "広島県",
  "山口県",

  "徳島県",
  "香川県",
  "愛媛県",
  "高知県",

  "福岡県",
  "佐賀県",
  "長崎県",
  "熊本県",
  "大分県",
  "宮崎県",
  "鹿児島県",

  "沖縄県"

];


/* =========================
   データ
========================= */

let counts =
  new Array(47).fill(0);

let giftName =
  "ハートミー";


/* =========================
   47マス生成
========================= */

function createPrefectures(){

  const container =
    document.getElementById(
      "prefectures"
    );

  container.innerHTML = "";

  prefectureNames.forEach(
    (name,index)=>{

      const div =
        document.createElement("div");

      div.className = "pref";

      div.id =
        "pref-" + index;

      div.innerHTML = `

        <div class="mark">
          ⭕
        </div>

        <div class="pref-name">
          ${name}
        </div>

        <div
          class="count ${
            counts[index] === 0
            ? "zero"
            : ""
          }"
          id="count-${index}">
          ${counts[index]}
        </div>

        <div class="buttons">

          <button
            class="minus"
            onclick="changeCount(${index},-1)">
            −
          </button>

          <button
            class="plus"
            onclick="changeCount(${index},1)">
            ＋
          </button>

        </div>

      `;

      container.appendChild(div);

    }
  );

}


/* =========================
   カウント
========================= */

function changeCount(index,value){

  counts[index] += value;

  if(counts[index] < 0){
    counts[index] = 0;
  }

  update();

}


/* =========================
   更新
========================= */

function update(){

  let total = 0;
  let completed = 0;

  counts.forEach(
    (num,index)=>{

      total += num;

      const countElement =
        document.getElementById(
          "count-" + index
        );

      const prefElement =
        document.getElementById(
          "pref-" + index
        );

      if(countElement){

        countElement.textContent =
          num;

        countElement.classList.toggle(
          "zero",
          num === 0
        );

      }

      if(prefElement){

        if(num > 0){

          prefElement.classList.add(
            "completed"
          );

          completed++;

        }else{

          prefElement.classList.remove(
            "completed"
          );

        }

      }

    }
  );


  document.getElementById(
    "total"
  ).textContent = total;


  document.getElementById(
    "completed"
  ).textContent = completed;


  document.getElementById(
    "progressText"
  ).textContent =
    completed + " / 47";


  document.getElementById(
    "progressBar"
  ).style.width =
    (completed / 47 * 100) + "%";


  if(completed === 47){

    showComplete();

  }

}


/* =========================
   ギフト名
========================= */

function saveGift(){

  const input =
    document.getElementById(
      "giftInput"
    );

  const value =
    input.value.trim();

  if(value){

    giftName = value;

    document.getElementById(
      "giftName1"
    ).textContent =
      giftName;

  }

}


/* =========================
   タイトル
========================= */

function toggleTitlePanel(){

  document
    .getElementById("titlePanel")
    .classList.toggle("show");

}


function saveTitle(){

  const value =
    document
      .getElementById("titleInput")
      .value
      .trim();

  if(value){

    document
      .getElementById("title")
      .textContent =
      value;

  }

  toggleTitlePanel();

}


/* =========================
   全リセット
========================= */

function resetAll(){

  if(
    !confirm(
      "47都道府県のカウントをすべて0にしますか？"
    )
  ){
    return;
  }

  counts =
    new Array(47).fill(0);

  document
    .getElementById("complete")
    .classList.remove("show");

  update();

}


/* =========================
   コンプリート
========================= */

function showComplete(){

  document
    .getElementById("completeGift")
    .textContent =
    giftName;

  document
    .getElementById("complete")
    .classList.add("show");

}


function closeComplete(){

  document
    .getElementById("complete")
    .classList.remove("show");

}


/* =========================
   初期化
========================= */

document
  .getElementById("giftInput")
  .value =
  giftName;

createPrefectures();

update();

</script>

</body>
</html>
