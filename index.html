<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TikTok LIVE 47都道府県ギフトカウント</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#070707;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;
}

.app{
  max-width:900px;
  margin:auto;
  padding-bottom:25px;
}

/* 上部 */
.top{
  position:sticky;
  top:0;
  z-index:10;
  background:#000;
  padding:9px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.top b{
  font-size:13px;
}

#modeBtn{
  border:0;
  border-radius:999px;
  padding:9px 12px;
  background:#ffd51a;
  color:#111;
  font-weight:900;
}

/* 編集画面 */
.editor{
  padding:11px;
  background:#121212;
  border-bottom:1px solid #333;
}

.editor label{
  display:block;
  font-size:12px;
  font-weight:900;
  margin-bottom:8px;
}

input{
  width:100%;
  margin-top:4px;
  padding:10px;
  border:1px solid #555;
  border-radius:8px;
  background:#252525;
  color:#fff;
}

.three{
  display:grid;
  grid-template-columns:1.2fr .8fr .8fr;
  gap:7px;
}

.actions{
  display:flex;
  gap:8px;
}

.actions button,
.modal-actions button{
  flex:1;
  border:0;
  border-radius:8px;
  padding:10px;
  background:#333;
  color:#fff;
  font-weight:900;
}

.editor p{
  margin:8px 0 0;
  color:#aaa;
  font-size:11px;
}

/* タイトル */
.headline{
  margin:10px 7px;
  padding:12px;
  border-radius:14px;
  text-align:center;
  background:linear-gradient(
    135deg,
    #791326,
    #171717,
    #806300
  );
  border:1px solid #9b7a18;
}

#titleView{
  font-size:clamp(24px,6vw,43px);
  font-weight:1000;
  line-height:1.05;
}

#subtitleView{
  font-size:clamp(18px,4vw,29px);
  font-weight:900;
  margin-top:3px;
}

.rule{
  margin-top:8px;
  font-size:clamp(13px,3.5vw,21px);
  font-weight:900;
}

.rule b,
.rule strong{
  color:#ffe100;
}

/* 進捗 */
.progress{
  margin:0 7px 8px;
  padding:8px;
  background:#181818;
  border:1px solid #333;
  border-radius:10px;
  display:flex;
  gap:8px;
  align-items:center;
}

.progress>div{
  height:9px;
  flex:1;
  background:#333;
  border-radius:99px;
  overflow:hidden;
}

.progress i{
  display:block;
  height:100%;
  width:0;
  background:#ffd51a;
}

/* 47マス */
.board{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  padding:0 6px;
}

.card{
  position:relative;
  background:#faf7ed;
  color:#111;
  border:2px solid #e4b91b;
  border-radius:10px;
  padding:7px 5px;
  min-height:148px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.card.done{
  background:#fff3a1;
  border-color:#ff3150;
}

.num{
  position:absolute;
  left:4px;
  top:4px;
  width:24px;
  height:24px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#6e1cff;
  color:#fff;
  font-size:12px;
  font-weight:900;
}

.pref{
  text-align:center;
  font-size:13px;
  font-weight:1000;
  padding:1px 20px;
}

.shop{
  text-align:center;
  font-size:14px;
  font-weight:900;
  line-height:1.2;
  min-height:35px;
  display:grid;
  place-items:center;
}

.count{
  text-align:center;
  font-size:23px;
  font-weight:1000;
}

.count small{
  font-size:11px;
}

.giftBtn{
  width:100%;
  height:45px;
  border:0;
  border-radius:8px;
  background:#d91e3f;
  color:#fff;
  font-weight:1000;
  font-size:15px;
}

.editBtn{
  width:100%;
  margin-top:4px;
  border:0;
  border-radius:7px;
  background:#ddd;
  padding:5px;
  font-size:11px;
  font-weight:900;
}

.doneMark{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  font-size:62px;
  pointer-events:none;
}

/* 配信モード */
.live .editor,
.live .editBtn{
  display:none;
}

.live .card{
  min-height:165px;
}

.live .giftBtn{
  height:58px;
  font-size:21px;
}

.live .count{
  font-size:28px;
}

/* モーダル */
.modal{
  position:fixed;
  inset:0;
  background:#000c;
  z-index:30;
  display:grid;
  place-items:center;
  padding:15px;
}

.hidden{
  display:none;
}

.modal-card{
  width:min(470px,100%);
  background:#191919;
  border:1px solid #555;
  border-radius:14px;
  padding:15px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  font-size:20px;
  margin-bottom:10px;
}

.modal-head button{
  border:0;
  background:#333;
  color:#fff;
  border-radius:50%;
  width:34px;
  height:34px;
  font-size:22px;
}

.modal-card label{
  display:block;
  font-size:12px;
  font-weight:900;
  margin-bottom:9px;
}

.modal-actions{
  display:flex;
  gap:8px;
}

.modal-actions button:last-child{
  background:#ffd51a;
  color:#111;
}

/* スマホ */
@media(max-width:520px){

  .three{
    grid-template-columns:1fr 1fr;
  }

  .three label:first-child{
    grid-column:1/-1;
  }

}

@media(max-width:380px){

  .board{
    grid-template-columns:repeat(2,1fr);
  }

}

/* PC */
@media(min-width:700px){

  .board{
    grid-template-columns:repeat(5,1fr);
  }

  .card{
    min-height:160px;
  }

}
</style>
</head>

<body>

<div class="app">

<header class="top">
  <b>🎯 GIFT COUNT BOARD</b>
  <button id="modeBtn">▶ 配信モード</button>
</header>

<section class="editor" id="editor">

  <label>
    タイトル
    <input id="titleInput">
  </label>

  <label>
    サブタイトル
    <input id="subtitleInput">
  </label>

  <div class="three">

    <label>
      ギフト名
      <input id="giftInput">
    </label>

    <label>
      1個のコイン数
      <input id="coinInput" type="number" min="1">
    </label>

    <label>
      必要ギフト数
      <input id="targetInput" type="number" min="1">
    </label>

  </div>

  <div class="actions">
    <button id="saveBtn">💾 保存</button>
    <button id="resetBtn">↺ 全リセット</button>
  </div>

  <p>
    タイトル・ギフト名・コイン数・必要ギフト数を自由に変更できます。
  </p>

</section>

<section class="headline">

  <div id="titleView"></div>

  <div id="subtitleView"></div>

  <div class="rule">
    🪙
    <b id="coinView"></b>コイン ×
    <b id="targetView"></b>個 ＝
    <strong id="totalView"></strong>コインで ⭕
  </div>

</section>

<div class="progress">

  <b id="progressText">0 / 47</b>

  <div>
    <i id="bar"></i>
  </div>

</div>

<main id="board" class="board"></main>

</div>


<!-- 編集モーダル -->

<div id="modal" class="modal hidden">

  <div class="modal-card">

    <div class="modal-head">
      <b>マスを編集</b>
      <button id="close">×</button>
    </div>

    <label>
      都道府県
      <input id="prefInput">
    </label>

    <label>
      店名・名前
      <input id="shopInput">
    </label>

    <label>
      残りギフト数
      <input id="countInput" type="number" min="0">
    </label>

    <div class="modal-actions">
      <button id="cancel">キャンセル</button>
      <button id="apply">保存</button>
    </div>

  </div>

</div>


<script>

const data = [

  ["北海道","札幌ラーメン すみれ"],
  ["青森県","青森魚菜センター"],
  ["岩手県","ぴょんぴょん舎"],
  ["宮城県","牛たん炭焼 利久"],
  ["秋田県","佐藤養助 総本店"],
  ["山形県","腰掛庵"],
  ["福島県","柏屋"],
  ["茨城県","めんたいパーク大洗"],
  ["栃木県","宇都宮みんみん"],
  ["群馬県","水沢うどん 大澤屋"],
  ["埼玉県","山田うどん食堂"],
  ["千葉県","とみ田"],
  ["東京都","浅草 今半"],
  ["神奈川県","崎陽軒"],
  ["新潟県","とんかつ太郎"],
  ["富山県","白えび亭"],
  ["石川県","近江町市場"],
  ["福井県","ヨーロッパ軒"],
  ["山梨県","ほうとう不動"],
  ["長野県","明治亭"],
  ["岐阜県","川上屋"],
  ["静岡県","さわやか"],
  ["愛知県","矢場とん"],
  ["三重県","赤福"],
  ["滋賀県","毛利志満"],
  ["京都府","よーじや"],
  ["大阪府","551蓬莱"],
  ["兵庫県","神戸元町 別館牡丹園"],
  ["奈良県","柿の葉すし本舗"],
  ["和歌山県","井出商店"],
  ["鳥取県","すなば珈琲"],
  ["島根県","しまねお魚センター"],
  ["岡山県","えびめしや"],
  ["広島県","お好み村"],
  ["山口県","いろり山賊"],
  ["徳島県","徳島ラーメン東大"],
  ["香川県","山越うどん"],
  ["愛媛県","霧の森菓子工房"],
  ["高知県","明神丸"],
  ["福岡県","一蘭"],
  ["佐賀県","井手ちゃんぽん"],
  ["長崎県","吉宗"],
  ["熊本県","桂花ラーメン"],
  ["大分県","岡本屋売店"],
  ["宮崎県","おぐら本店"],
  ["鹿児島県","天文館むじゃき"],
  ["沖縄県","A&W"]

];


const KEY = "tiktok_47_coin_board_single_html";


let state =
  JSON.parse(localStorage.getItem(KEY) || "null");


if(!state){

  state = {

    title:"全国47都道府県",

    subtitle:"有名店47選",

    gift:"さつまいもギフト",

    coin:5,

    target:10,

    cards:data.map(x => ({

      pref:x[0],

      shop:x[1],

      count:10,

      done:false

    }))

  };

}


const $ = id =>
  document.getElementById(id);


let editing = -1;


/* HTMLエスケープ */

function esc(value){

  return String(value).replace(
    /[&<>"']/g,
    function(m){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[m];

    }
  );

}


/* 保存 */

function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(state)
  );

}


/* 表示更新 */

function sync(){

  $("titleView").textContent =
    state.title;

  $("subtitleView").textContent =
    state.subtitle;

  $("coinView").textContent =
    state.coin;

  $("targetView").textContent =
    state.target;

  $("totalView").textContent =
    state.coin * state.target;


  $("titleInput").value =
    state.title;

  $("subtitleInput").value =
    state.subtitle;

  $("giftInput").value =
    state.gift;

  $("coinInput").value =
    state.coin;

  $("targetInput").value =
    state.target;

}


/* 47マス表示 */

function render(){

  const board =
    $("board");

  board.innerHTML = "";


  state.cards.forEach(
    function(card,index){

      const element =
        document.createElement("article");


      element.className =
        "card" +
        (card.done ? " done" : "");


      element.innerHTML = `

        <div class="num">
          ${index + 1}
        </div>

        <div class="pref">
          ${esc(card.pref)}
        </div>

        <div class="shop">
          ${esc(card.shop)}
        </div>

        <div class="count">

          ${
            card.done
            ? "完成"
            : `あと ${card.count}<small> 個</small>`
          }

        </div>

        <button class="giftBtn">

          ${
            card.done
            ? "⭕ 完成"
            : `🪙 ${state.coin}コインギフト ＋1`
          }

        </button>

        <button class="editBtn">
          ✏️ 編集
        </button>

        ${
          card.done
          ? '<div class="doneMark">⭕</div>'
          : ''
        }

      `;


      element.querySelector(".giftBtn")
        .onclick = function(){

          gift(index);

        };


      element.querySelector(".editBtn")
        .onclick = function(){

          openEditor(index);

        };


      board.appendChild(element);

    }
  );


  const completed =
    state.cards.filter(
      card => card.done
    ).length;


  $("progressText").textContent =
    completed + " / 47";


  $("bar").style.width =
    completed / 47 * 100 + "%";

}


/* ギフトを受け取ったとき */

function gift(index){

  const card =
    state.cards[index];


  if(card.done){
    return;
  }


  card.count =
    Math.max(
      0,
      card.count - 1
    );


  if(card.count === 0){

    card.done = true;

  }


  save();

  render();

}


/* 編集画面 */

function openEditor(index){

  editing = index;

  const card =
    state.cards[index];


  $("prefInput").value =
    card.pref;

  $("shopInput").value =
    card.shop;

  $("countInput").value =
    card.done
    ? 0
    : card.count;


  $("modal").classList.remove(
    "hidden"
  );

}


/* 編集画面を閉じる */

function closeModal(){

  $("modal").classList.add(
    "hidden"
  );

  editing = -1;

}


/* 編集保存 */

$("apply").onclick = function(){

  if(editing < 0){
    return;
  }


  const card =
    state.cards[editing];


  card.pref =
    $("prefInput").value.trim()
    || card.pref;


  card.shop =
    $("shopInput").value.trim()
    || card.shop;


  card.count =
    Math.max(
      0,
      Number(
        $("countInput").value
      ) || 0
    );


  card.done =
    card.count === 0;


  save();

  render();

  closeModal();

};


$("cancel").onclick =
  closeModal;

$("close").onclick =
  closeModal;


/* タイトル */

$("titleInput").oninput =
  function(){

    state.title =
      this.value;

    $("titleView").textContent =
      state.title;

    save();

  };


/* サブタイトル */

$("subtitleInput").oninput =
  function(){

    state.subtitle =
      this.value;

    $("subtitleView").textContent =
      state.subtitle;

    save();

  };


/* ギフト */

$("giftInput").oninput =
  function(){

    state.gift =
      this.value;

    save();

  };


/* コイン */

$("coinInput").oninput =
  function(){

    state.coin =
      Math.max(
        1,
        Number(this.value) || 1
      );

    sync();

    render();

    save();

  };


/* 必要ギフト数 */

$("targetInput").oninput =
  function(){

    state.target =
      Math.max(
        1,
        Number(this.value) || 1
      );

    sync();

    save();

  };


/* 保存 */

$("saveBtn").onclick =
  function(){

    save();

    this.textContent =
      "✓ 保存済み";


    setTimeout(
      () => {
        this.textContent =
          "💾 保存";
      },
      1000
    );

  };


/* 全リセット */

$("resetBtn").onclick =
  function(){

    if(
      !confirm(
        "47マスをリセットしますか？"
      )
    ){

      return;

    }


    state.cards.forEach(
      function(card){

        card.count =
          state.target;

        card.done = false;

      }
    );


    save();

    render();

  };


/* 配信モード */

$("modeBtn").onclick =
  function(){

    document.body.classList.toggle(
      "live"
    );


    this.textContent =
      document.body.classList.contains("live")
      ? "✏️ 編集モード"
      : "▶ 配信モード";

  };


/* 初期表示 */

sync();

render();

</script>

</body>
</html>
